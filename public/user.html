<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>User Dashboard - FlirtyFly</title>

<script src="/socket.io/socket.io.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  font-family:Segoe UI,sans-serif;

  background:
  linear-gradient(
    135deg,
    #fff0f4,
    #ffe4ec
  );

  color:#222;

  display:flex;

  min-height:100vh;

  overflow-x:hidden;
}

/* SIDEBAR */
.sidebar{

  width:270px;

  background:white;

  padding:35px 22px;

  border-right:
  1px solid #f1f1f1;

  position:fixed;

  top:0;
  left:0;
  bottom:0;

  z-index:100;
}

.sidebar h1{

  font-size:32px;

  color:#ff4f87;

  margin-bottom:45px;
}

.sidebar ul{

  list-style:none;
}

.menu-item{

  padding:16px 18px;

  border-radius:18px;

  margin-bottom:12px;

  cursor:pointer;

  font-weight:600;

  transition:0.3s;

  color:#555;
}

.menu-item:hover{

  background:#fff1f5;

  color:#ff4f87;
}

.active-menu{

  background:
  linear-gradient(
    135deg,
    #ff4f87,
    #ff7b54
  );

  color:white;
}

/* MAIN */
.main{

  flex:1;

  margin-left:270px;

  padding:30px;
}

/* TOPBAR */
.topbar{

  background:white;

  border-radius:25px;

  padding:22px 28px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:30px;

  box-shadow:
  0 10px 25px rgba(0,0,0,0.05);
}

.topbar h2{

  font-size:30px;
}

.premium{

  background:
  linear-gradient(
    135deg,
    #ff4f87,
    #ff7b54
  );

  color:white;

  padding:12px 22px;

  border-radius:50px;

  font-size:14px;

  font-weight:600;
}

/* HOST GRID */
.cards{

  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(260px,1fr));

  gap:25px;
}

/* CARD */
.card{

  background:white;

  border-radius:30px;

  overflow:hidden;

  box-shadow:
  0 15px 35px rgba(0,0,0,0.06);

  transition:0.3s;
}

.card:hover{

  transform:
  translateY(-6px);
}

.image{

  position:relative;
}

.image img{

  width:100%;

  height:320px;

  object-fit:cover;
}

.online,
.offline{

  position:absolute;

  top:18px;
  right:18px;

  padding:8px 14px;

  border-radius:50px;

  font-size:12px;

  font-weight:600;

  color:white;
}

.online{

  background:#00c853;
}

.offline{

  background:#ff5252;
}

.content{

  padding:22px;
}

.content h3{

  font-size:24px;

  margin-bottom:8px;
}

.content p{

  color:#666;

  margin-bottom:20px;
}

.content button{

  width:100%;

  border:none;

  padding:15px;

  border-radius:18px;

  background:
  linear-gradient(
    135deg,
    #ff4f87,
    #ff7b54
  );

  color:white;

  font-size:15px;

  font-weight:600;

  cursor:pointer;
}

/* SUBSCRIPTIONS */
.section{

  display:none;
}

.sub-card,
.history-card,
.settings-card,
.simple-profile{

  background:white;

  padding:30px;

  border-radius:30px;

  margin-bottom:25px;

  box-shadow:
  0 10px 25px rgba(0,0,0,0.05);
}

.sub-card h1{

  color:#ff4f87;

  margin:15px 0;
}

.buy-btn,
.logout-btn{

  margin-top:20px;

  width:100%;

  border:none;

  padding:15px;

  border-radius:18px;

  background:
  linear-gradient(
    135deg,
    #ff4f87,
    #ff7b54
  );

  color:white;

  font-weight:600;

  cursor:pointer;
}

/* PROFILE */
.small-avatar{

  width:90px;
  height:90px;

  margin:auto;

  border-radius:28px;

  background:
  linear-gradient(
    135deg,
    #ff4f87,
    #ff7b54
  );

  color:white;

  display:flex;

  justify-content:center;
  align-items:center;

  font-size:34px;

  font-weight:700;

  margin-bottom:20px;
}

.profile-menu{

  display:flex;

  flex-direction:column;

  gap:15px;

  margin-top:30px;
}

.profile-menu a{

  text-decoration:none;

  background:#fff3f6;

  padding:16px;

  border-radius:18px;

  color:#ff4f87;

  font-weight:600;
}

/* HISTORY */
.history-card{

  display:flex;

  align-items:center;

  gap:18px;
}

.history-card img{

  width:80px;
  height:80px;

  border-radius:20px;

  object-fit:cover;
}

/* MODAL */
.modal{

  position:fixed;

  inset:0;

  background:
  rgba(0,0,0,0.6);

  display:none;

  justify-content:center;

  align-items:center;

  z-index:1000;
}

.modal-box{

  width:90%;
  max-width:400px;

  background:white;

  border-radius:32px;

  padding:25px;

  text-align:center;

  position:relative;
}

.modal-box img{

  width:100%;

  height:380px;

  object-fit:cover;

  border-radius:24px;

  margin-bottom:20px;
}

.close{

  position:absolute;

  top:15px;
  right:20px;

  font-size:28px;

  cursor:pointer;
}

.call-btn{

  width:100%;

  margin-top:20px;

  border:none;

  padding:16px;

  border-radius:18px;

  background:
  linear-gradient(
    135deg,
    #ff4f87,
    #ff7b54
  );

  color:white;

  font-weight:600;

  cursor:pointer;
}

/* MOBILE */
@media(max-width:900px){

  body{

    flex-direction:column;
  }

  .sidebar{

    width:100%;

    position:relative;

    border-right:none;
  }

  .main{

    margin-left:0;
  }
}

</style>

</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar">

  <h1>
    FlirtyFly
  </h1>

  <ul>

    <li
      class="menu-item active-menu"
      onclick="showSection('discover',this)"
    >
      Discover
    </li>

    <li
      class="menu-item"
      onclick="showSection('subscriptions',this)"
    >
      Subscriptions
    </li>

    <li
      class="menu-item"
      onclick="showSection('history',this)"
    >
      Call History
    </li>

    <li
      class="menu-item"
      onclick="showSection('profile',this)"
    >
      Profile
    </li>

    <li
      class="menu-item"
      onclick="showSection('settings',this)"
    >
      Settings
    </li>

  </ul>

</aside>

<!-- MAIN -->
<main class="main">

<div class="topbar">

  <h2 id="pageTitle">
    Discover Hosts
  </h2>

  <div class="premium">
    Premium Active
  </div>

</div>

<!-- DISCOVER -->
<div
  class="cards"
  id="discoverSection"
></div>

<!-- SUBSCRIPTIONS -->
<div
  class="section"
  id="subscriptionsSection"
>

  <div class="sub-card">

    <h2>
      Premium Plan
    </h2>

    <h1>
      ₹499
    </h1>

    <p>
      Unlimited Video Calls
    </p>

    <button class="buy-btn">
      Buy Subscription
    </button>

  </div>

</div>

<!-- HISTORY -->
<div
  class="section"
  id="historySection"
>

  <div class="history-card">

    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=800">

    <div>

      <h3>
        Riya
      </h3>

      <p>
        15 Minutes Call
      </p>

    </div>

  </div>

</div>

<!-- PROFILE -->
<div
  class="section"
  id="profileSection"
>

  <div class="simple-profile">

    <div
      class="small-avatar"
      id="avatarLetter"
    >
      U
    </div>

    <h2 id="profileGreeting">
      Hi User 👋
    </h2>

    <div class="profile-menu">

      <a href="/edit-profile.html">
        Edit Profile
      </a>

    </div>

  </div>

</div>

<!-- SETTINGS -->
<div
  class="section"
  id="settingsSection"
>

  <div class="settings-card">

    <h2>
      Account Settings
    </h2>

    <button
      class="logout-btn"
      onclick="logoutUser()"
    >
      Logout
    </button>

  </div>

</div>

</main>

<!-- MODAL -->
<div
  class="modal"
  id="profileModal"
>

  <div class="modal-box">

    <span
      class="close"
      onclick="closeModal()"
    >
      ×
    </span>

    <img id="modalImage">

    <h2 id="modalName"></h2>

    <p>
      Premium Live Video Host
    </p>

    <button
      class="call-btn"
      onclick="startCall()"
    >
      Start Video Call
    </button>

  </div>

</div>

<script>

const socket = io();

let selectedHost = {};

/* LOAD HOSTS */
async function loadHosts(){

  const response = await fetch(
    "/get-hosts"
  );

  const hosts =
    await response.json();

  const discoverSection =

    document.getElementById(
      "discoverSection"
    );

  discoverSection.innerHTML = "";

  hosts.forEach((host)=>{

    discoverSection.innerHTML += `

      <div class="card">

        <div class="image">

          <img
            src="/uploads/${host.image}"
          >

          <span class="${
            host.status === "Online"
            ? "online"
            : "offline"
          }">

            ${host.status}

          </span>

        </div>

        <div class="content">

          <h3>
            ${host.name}
          </h3>

          <p>
            Premium Live Video Host
          </p>

          <button
            onclick="openProfile(
              '${host._id}',
              '${host.name}',
              '${host.image}'
            )"
          >
            Start Call
          </button>

        </div>

      </div>

    `;

  });

}

/* OPEN MODAL */
function openProfile(
  id,
  name,
  image
){

  selectedHost = {
    id,
    name,
    image
  };

  document.getElementById(
    "profileModal"
  ).style.display = "flex";

  document.getElementById(
    "modalName"
  ).innerText = name;

  document.getElementById(
    "modalImage"
  ).src = `/uploads/${image}`;

}

/* CLOSE */
function closeModal(){

  document.getElementById(
    "profileModal"
  ).style.display = "none";

}

/* START CALL */
async function startCall(){

  const userMobile =

    localStorage.getItem(
      "userMobile"
    );

  const userName =

    localStorage.getItem(
      "userName"
    );

  await fetch(

    "/save-call",

    {

      method:"POST",

      headers:{
        "Content-Type":
        "application/json"
      },

      body:JSON.stringify({

        userMobile,

        hostId:
        selectedHost.id,

        hostName:
        selectedHost.name,

        hostImage:
        selectedHost.image

      })

    }

  );

  socket.emit(

    "call-host",

    {

      hostId:
      selectedHost.id,

      callerName:
      userName

    }

  );

  window.location.href =
  "/call.html?role=user";

}

/* SECTIONS */
function showSection(
  section,
  element
){

  document.querySelectorAll(
    ".menu-item"
  ).forEach((item)=>{

    item.classList.remove(
      "active-menu"
    );

  });

  element.classList.add(
    "active-menu"
  );

  document.querySelectorAll(
    ".section"
  ).forEach((sec)=>{

    sec.style.display = "none";

  });

  document.getElementById(
    "discoverSection"
  ).style.display = "none";

  if(section === "discover"){

    document.getElementById(
      "discoverSection"
    ).style.display = "grid";

    document.getElementById(
      "pageTitle"
    ).innerText =

    "Discover Hosts";

  }else{

    document.getElementById(
      section + "Section"
    ).style.display = "block";

    document.getElementById(
      "pageTitle"
    ).innerText =

    section
    .charAt(0)
    .toUpperCase()
    + section.slice(1);

  }

}

/* USER */
const savedName =

  localStorage.getItem(
    "userName"
  );

if(savedName){

  document.getElementById(
    "profileGreeting"
  ).innerText =

  `Hi, ${savedName} 👋`;

  document.getElementById(
    "avatarLetter"
  ).innerText =

  savedName
  .charAt(0)
  .toUpperCase();

}

/* LOGOUT */
function logoutUser(){

  localStorage.clear();

  window.location.href =
  "/login.html";

}

/* LOAD */
loadHosts();

</script>

</body>

</html>

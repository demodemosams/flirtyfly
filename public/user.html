<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>User Dashboard - FlirtyFly</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  font-family:Segoe UI,sans-serif;

  background:
  linear-gradient(
    135deg,
    #fff0f4,
    #ffe4ec
  );

  color:#222;

  display:flex;

  min-height:100vh;

  overflow-x:hidden;
}

/* SIDEBAR */
.sidebar{

  width:270px;

  background:white;

  padding:35px 22px;

  border-right:
  1px solid #f1f1f1;

  position:fixed;

  top:0;
  left:0;
  bottom:0;

  z-index:100;
}

.sidebar h1{

  font-size:32px;

  color:#ff4f87;

  margin-bottom:45px;
}

.sidebar ul{

  list-style:none;
}

.menu-item{

  padding:16px 18px;

  border-radius:18px;

  margin-bottom:12px;

  cursor:pointer;

  font-weight:600;

  transition:0.3s;

  color:#555;
}

.menu-item:hover{

  background:#fff1f5;

  color:#ff4f87;
}

.active-menu{

  background:
  linear-gradient(
    135deg,
    #ff4f87,
    #ff7b54
  );

  color:white;
}

/* MAIN */
.main{

  flex:1;

  margin-left:270px;

  padding:30px;
}

/* TOPBAR */
.topbar{

  background:white;

  border-radius:25px;

  padding:22px 28px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:30px;

  box-shadow:
  0 10px 25px rgba(0,0,0,0.05);
}

.topbar h2{

  font-size:30px;
}

.premium{

  background:
  linear-gradient(
    135deg,
    #ff4f87,
    #ff7b54
  );

  color:white;

  padding:12px 22px;

  border-radius:50px;

  font-size:14px;

  font-weight:600;
}

/* HOST GRID */
.cards{

  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(260px,1fr));

  gap:25px;
}

/* CARD */
.card{

  background:white;

  border-radius:30px;

  overflow:hidden;

  box-shadow:
  0 15px 35px rgba(0,0,0,0.06);

  transition:0.3s;
}

.card:hover{

  transform:
  translateY(-6px);
}

/* IMAGE */
.image{

  position:relative;
}

.image img{

  width:100%;

  height:320px;

  object-fit:cover;
}

/* STATUS */
.online,
.offline{

  position:absolute;

  top:18px;
  right:18px;

  padding:8px 14px;

  border-radius:50px;

  font-size:12px;

  font-weight:600;

  color:white;
}

.online{

  background:#00c853;
}

.offline{

  background:#ff5252;
}

/* CONTENT */
.content{

  padding:22px;
}

.content h3{

  font-size:24px;

  margin-bottom:8px;
}

.content p{

  color:#666;

  margin-bottom:20px;
}

/* BUTTON */
.content button{

  width:100%;

  border:none;

  padding:15px;

  border-radius:18px;

  background:
  linear-gradient(
    135deg,
    #ff4f87,
    #ff7b54
  );

  color:white;

  font-size:15px;

  font-weight:600;

  cursor:pointer;

  transition:0.3s;
}

.content button:hover{

  transform:translateY(-3px);
}

/* PROFILE */
.profile-section{

  display:none;
}

.simple-profile{

  background:white;

  border-radius:35px;

  padding:40px;

  text-align:center;

  box-shadow:
  0 15px 35px rgba(0,0,0,0.05);
}

.small-avatar{

  width:90px;
  height:90px;

  margin:auto;

  border-radius:28px;

  background:
  linear-gradient(
    135deg,
    #ff4f87,
    #ff7b54
  );

  color:white;

  display:flex;

  justify-content:center;
  align-items:center;

  font-size:34px;

  font-weight:700;

  margin-bottom:20px;
}

.profile-menu{

  display:flex;

  flex-direction:column;

  gap:15px;

  margin-top:30px;
}

.profile-menu a{

  text-decoration:none;

  background:#fff3f6;

  padding:16px;

  border-radius:18px;

  color:#ff4f87;

  font-weight:600;
}

/* MODAL */
.modal{

  position:fixed;

  inset:0;

  background:
  rgba(0,0,0,0.6);

  display:none;

  justify-content:center;

  align-items:center;

  z-index:1000;
}

.modal-box{

  width:90%;
  max-width:400px;

  background:white;

  border-radius:32px;

  padding:25px;

  text-align:center;

  position:relative;
}

.modal-box img{

  width:100%;

  height:380px;

  object-fit:cover;

  border-radius:24px;

  margin-bottom:20px;
}

.close{

  position:absolute;

  top:15px;
  right:20px;

  font-size:28px;

  cursor:pointer;
}

.call-btn{

  width:100%;

  margin-top:20px;

  border:none;

  padding:16px;

  border-radius:18px;

  background:
  linear-gradient(
    135deg,
    #ff4f87,
    #ff7b54
  );

  color:white;

  font-weight:600;

  cursor:pointer;
}

/* MOBILE */
@media(max-width:900px){

  body{

    flex-direction:column;
  }

  .sidebar{

    width:100%;

    position:relative;

    border-right:none;
  }

  .main{

    margin-left:0;
  }

  .topbar{

    flex-direction:column;

    align-items:flex-start;

    gap:15px;
  }
}

</style>

</head>

<body>

<!-- SIDEBAR -->
<aside
  class="sidebar"
  id="sidebar"
>

  <h1>
    FlirtyFly
  </h1>

  <ul>

    <li
      class="menu-item active-menu"
      onclick="showDiscover(this)"
    >
      Discover
    </li>

    <li
      class="menu-item"
      onclick="showProfile(this)"
    >
      Profile
    </li>

  </ul>

</aside>

<!-- MAIN -->
<main class="main">

  <!-- TOPBAR -->
  <div class="topbar">

    <h2 id="pageTitle">

      Discover Hosts

    </h2>

    <div class="premium">

      Premium Active

    </div>

  </div>

  <!-- HOSTS -->
  <div
    class="cards"
    id="hostCards"
  ></div>

  <!-- PROFILE -->
  <div
    class="profile-section"
    id="profileSection"
  >

    <div class="simple-profile">

      <div
        class="small-avatar"
        id="avatarLetter"
      >

        U

      </div>

      <h2
        id="profileGreeting"
      >

        Hi, User 👋

      </h2>

      <p>

        Welcome back to FlirtyFly

      </p>

      <div class="profile-menu">

        <a href="/edit-profile.html">

          Edit Profile

        </a>

        <a
          href="#"
          onclick="logoutUser()"
        >

          Logout

        </a>

      </div>

    </div>

  </div>

</main>

<!-- MODAL -->
<div
  class="modal"
  id="profileModal"
>

  <div class="modal-box">

    <span
      class="close"
      onclick="closeModal()"
    >
      ×
    </span>

    <img id="modalImage">

    <h2 id="modalName"></h2>

    <p>

      Premium Live Video Host

    </p>

    <button
      class="call-btn"
      onclick="startCall()"
    >

      Start Video Call

    </button>

  </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

let selectedHost = {};

/* LOAD REAL HOSTS */
async function loadHosts(){

  try{

    const response = await fetch(
      "/get-hosts"
    );

    const hosts =
      await response.json();

    const hostCards =

      document.getElementById(
        "hostCards"
      );

    hostCards.innerHTML = "";

    hosts.forEach((host) => {

      hostCards.innerHTML += `

        <div class="card">

          <div class="image">

            <img
              src="/uploads/${host.image}"
            >

            <span class="${
              host.status === "Online"
              ? "online"
              : "offline"
            }">

              ${host.status}

            </span>

          </div>

          <div class="content">

            <h3>
              ${host.name}
            </h3>

            <p>
              Premium Live Video Host
            </p>

            <button
              onclick="openProfile(
                '${host._id}',
                '${host.name}',
                '${host.image}'
              )"
            >

              Start Call

            </button>

          </div>

        </div>

      `;

    });

  }catch(error){

    console.log(error);

  }

}

/* OPEN MODAL */
function openProfile(
  id,
  name,
  image
){

  selectedHost = {

    id,
    name,
    image

  };

  document.getElementById(
    "profileModal"
  ).style.display = "flex";

  document.getElementById(
    "modalName"
  ).innerText = name;

  document.getElementById(
    "modalImage"
  ).src = `/uploads/${image}`;

}

/* CLOSE MODAL */
function closeModal(){

  document.getElementById(
    "profileModal"
  ).style.display = "none";

}

/* START CALL */
async function startCall(){

  const userMobile =

    localStorage.getItem(
      "userMobile"
    );

  const userName =

    localStorage.getItem(
      "userName"
    );

  await fetch(

    "/save-call",

    {

      method:"POST",

      headers:{
        "Content-Type":
        "application/json"
      },

      body:JSON.stringify({

        userMobile,

        hostId:
        selectedHost.id,

        hostName:
        selectedHost.name,

        hostImage:
        selectedHost.image

      })

    }

  );

  socket.emit(

    "call-host",

    {

      hostId:
      selectedHost.id,

      callerName:
      userName

    }

  );

  alert(
    "Calling Host..."
  );

  window.location.href =

  `/call.html?role=user`;

}

/* MENU */
function setActiveMenu(element){

  document.querySelectorAll(
    ".menu-item"
  ).forEach((item)=>{

    item.classList.remove(
      "active-menu"
    );

  });

  element.classList.add(
    "active-menu"
  );

}

/* DISCOVER */
function showDiscover(element){

  setActiveMenu(element);

  document.getElementById(
    "hostCards"
  ).style.display = "grid";

  document.getElementById(
    "profileSection"
  ).style.display = "none";

  document.getElementById(
    "pageTitle"
  ).innerText =

  "Discover Hosts";

}

/* PROFILE */
function showProfile(element){

  setActiveMenu(element);

  document.getElementById(
    "hostCards"
  ).style.display = "none";

  document.getElementById(
    "profileSection"
  ).style.display = "block";

  document.getElementById(
    "pageTitle"
  ).innerText =

  "My Profile";

}

/* LOGOUT */
function logoutUser(){

  localStorage.removeItem(
    "userName"
  );

  localStorage.removeItem(
    "userMobile"
  );

  window.location.href =
  "/login.html";

}

/* USER DATA */
const savedName =

  localStorage.getItem(
    "userName"
  );

if(savedName){

  document.getElementById(
    "profileGreeting"
  ).innerText =

  `Hi, ${savedName} 👋`;

  document.getElementById(
    "avatarLetter"
  ).innerText =

  savedName
    .charAt(0)
    .toUpperCase();

}

/* LOAD */
loadHosts();

</script>

</body>

</html>

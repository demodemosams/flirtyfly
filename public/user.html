<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>User Dashboard - FlirtyFly</title>

  <link rel="stylesheet" href="user.css">

</head>

<body>

  <!-- SIDEBAR -->
  <aside
    class="sidebar"
    id="sidebar"
  >

    <h1>FlirtyFly</h1>

    <ul>

      <li
        class="menu-item"
        onclick="showDiscover(this)"
      >
        Discover
      </li>

      <li
        class="menu-item"
        onclick="showSubscriptions(this)"
      >
        Subscriptions
      </li>

      <li
        class="menu-item"
        onclick="showCallHistory(this)"
      >
        Call History
      </li>

      <li
        class="menu-item"
        onclick="showProfile(this)"
      >
        Profile
      </li>

      <li
        class="menu-item"
        onclick="showSettings(this)"
      >
        Settings
      </li>

    </ul>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- TOPBAR -->
    <div class="topbar">

      <h2 id="pageTitle">
        Discover Hosts
      </h2>

      <div class="premium">
        Premium Active
      </div>

    </div>

    <!-- HOSTS -->
    <div
      class="cards"
      id="hostCards"
    >

      <!-- HOST CARD -->
      <div class="card">

        <div class="image">

          <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=800">

          <span class="online">
            Online
          </span>

        </div>

        <div class="content">

          <h3>Riya</h3>

          <p>
            Live Video Call Host
          </p>

          <button
            onclick="openProfile(
              'Riya',
              'https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=800'
            )"
          >
            Start Call
          </button>

        </div>

      </div>

      <!-- HOST CARD -->
      <div class="card">

        <div class="image">

          <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=800">

          <span class="online">
            Online
          </span>

        </div>

        <div class="content">

          <h3>Priya</h3>

          <p>
            Live Video Call Host
          </p>

          <button
            onclick="openProfile(
              'Priya',
              'https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=800'
            )"
          >
            Start Call
          </button>

        </div>

      </div>

    </div>

    <!-- PROFILE -->
    <div
      class="profile-section"
      id="profileSection"
      style="display:none;"
    >

      <div class="simple-profile">

        <div class="small-avatar">

          U

        </div>

        <h2>
          Hi, User 👋
        </h2>

        <p>
          Welcome back to FlirtyFly
        </p>

        <div class="profile-menu">

          <a href="/edit-profile.html">
            Edit Profile
          </a>

          <a
            href="#"
            onclick="logoutUser()"
          >
            Logout
          </a>

        </div>

      </div>

    </div>

  </main>

  <!-- MODAL -->
  <div
    class="modal"
    id="profileModal"
  >

    <div class="modal-box">

      <span
        class="close"
        onclick="closeModal()"
      >
        ×
      </span>

      <img id="modalImage">

      <h2 id="modalName"></h2>

      <p>
        Premium Live Video Host
      </p>

      <button
        class="call-btn"
      >
        Start Video Call
      </button>

    </div>

  </div>

<script>

function setActiveMenu(element){

  document.querySelectorAll(
    ".menu-item"
  ).forEach((item)=>{

    item.classList.remove(
      "active-menu"
    );

  });

  element.classList.add(
    "active-menu"
  );

}

function showDiscover(element){

  setActiveMenu(element);

  document.getElementById(
    "hostCards"
  ).style.display = "grid";

  document.getElementById(
    "profileSection"
  ).style.display = "none";

  document.getElementById(
    "pageTitle"
  ).innerText =

  "Discover Hosts";

}

function showProfile(element){

  setActiveMenu(element);

  document.getElementById(
    "hostCards"
  ).style.display = "none";

  document.getElementById(
    "profileSection"
  ).style.display = "block";

  document.getElementById(
    "pageTitle"
  ).innerText =

  "My Profile";

}

function openProfile(name,image){

  document.getElementById(
    "profileModal"
  ).style.display = "flex";

  document.getElementById(
    "modalName"
  ).innerText = name;

  document.getElementById(
    "modalImage"
  ).src = image;

}

function closeModal(){

  document.getElementById(
    "profileModal"
  ).style.display = "none";

}

function logoutUser(){

  window.location.href =
  "/login.html";

}

</script>

</body>

</html>

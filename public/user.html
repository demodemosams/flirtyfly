<!-- REAL DATABASE CONNECTED HOST SECTION -->

<div
  class="cards"
  id="hostCards"
></div>

<script>

async function loadHosts(){

  try{

    const response = await fetch(
      "/get-hosts"
    );

    const hosts =
      await response.json();

    const hostCards =

      document.getElementById(
        "hostCards"
      );

    hostCards.innerHTML = "";

    hosts.forEach((host) => {

      hostCards.innerHTML += `

        <div class="card">

          <div class="image">

            <img
              src="/uploads/${host.image}"
            >

            <span class="${
              host.status === "Online"
              ? "online"
              : "offline"
            }">

              ${host.status}

            </span>

          </div>

          <div class="content">

            <h3>
              ${host.name}
            </h3>

            <p>
              Premium Live Video Host
            </p>

            <button
              onclick="openProfile(
                '${host._id}',
                '${host.name}',
                '${host.image}'
              )"
            >

              Start Call

            </button>

          </div>

        </div>

      `;

    });

  }catch(error){

    console.log(error);

  }

}

/* OPEN HOST MODAL */
function openProfile(
  id,
  name,
  image
){

  selectedHost = {

    id,
    name,
    image

  };

  document.getElementById(
    "profileModal"
  ).style.display = "flex";

  document.getElementById(
    "modalName"
  ).innerText = name;

  document.getElementById(
    "modalImage"
  ).src = `/uploads/${image}`;

}

/* CLOSE MODAL */
function closeModal(){

  document.getElementById(
    "profileModal"
  ).style.display = "none";

}

/* START VIDEO CALL */
async function startCall(){

  const userMobile =

    localStorage.getItem(
      "userMobile"
    );

  const userName =

    localStorage.getItem(
      "userName"
    );

  await fetch(

    "/save-call",

    {

      method:"POST",

      headers:{
        "Content-Type":
        "application/json"
      },

      body:JSON.stringify({

        userMobile,

        hostId:
        selectedHost.id,

        hostName:
        selectedHost.name,

        hostImage:
        selectedHost.image

      })

    }

  );

  socket.emit(

    "call-host",

    {

      hostId:
      selectedHost.id,

      callerName:
      userName

    }

  );

  alert(
    "Calling Host..."
  );

  window.location.href =

  `/call.html?role=user`;

}

/* LOAD REAL HOSTS */
loadHosts();

</script>

<!-- MODAL -->
<div
  class="modal"
  id="profileModal"
>

  <div class="modal-box">

    <span
      class="close"
      onclick="closeModal()"
    >
      ×
    </span>

    <img id="modalImage">

    <h2 id="modalName"></h2>

    <p>
      Premium Live Video Host
    </p>

    <button
      class="call-btn"
      onclick="startCall()"
    >

      Start Video Call

    </button>

  </div>

</div>

<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login - FlirtyFly</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  font-family:Segoe UI,sans-serif;

  min-height:100vh;

  background:
  linear-gradient(
    135deg,
    #ffdce3,
    #f5a5b0
  );

  display:flex;
  justify-content:center;
  align-items:center;

  padding:30px;
}

/* MAIN CARD */
.container{

  width:100%;
  max-width:1180px;

  min-height:700px;

  background:white;

  border-radius:35px;

  overflow:hidden;

  display:grid;

  grid-template-columns:1fr 1fr;

  box-shadow:
  0 25px 60px rgba(0,0,0,0.15);
}

/* LEFT */
.left{

  position:relative;

  background:
  linear-gradient(
    135deg,
    #ff416c,
    #ff4b2b
  );

  color:white;

  display:flex;

  flex-direction:column;

  justify-content:center;

  padding:80px;

  overflow:hidden;
}

/* DESIGN CIRCLES */
.left::before{

  content:"";

  position:absolute;

  width:320px;
  height:320px;

  background:
  rgba(255,255,255,0.08);

  border-radius:50%;

  top:-120px;
  right:-100px;
}

.left::after{

  content:"";

  position:absolute;

  width:240px;
  height:240px;

  background:
  rgba(255,255,255,0.08);

  border-radius:50%;

  bottom:-80px;
  left:-80px;
}

.left-content{

  position:relative;

  z-index:2;
}

.left h1{

  font-size:62px;

  line-height:1.1;

  margin-bottom:22px;
}

.left p{

  font-size:19px;

  line-height:1.9;

  max-width:460px;

  opacity:0.95;
}

/* BADGE */
.host-badge{

  margin-top:40px;

  display:inline-flex;

  align-items:center;

  gap:12px;

  width:max-content;

  padding:15px 24px;

  background:
  rgba(255,255,255,0.12);

  border:1px solid rgba(255,255,255,0.18);

  border-radius:50px;

  backdrop-filter:blur(8px);

  font-size:15px;

  font-weight:600;
}

/* RIGHT */
.right{

  display:flex;

  justify-content:center;

  align-items:center;

  padding:50px;
}

/* LOGIN BOX */
.login-box{

  width:100%;
  max-width:420px;
}

.login-box h2{

  text-align:center;

  font-size:42px;

  color:#ff416c;

  margin-bottom:10px;
}

.sub-text{

  text-align:center;

  color:#777;

  margin-bottom:35px;

  font-size:15px;
}

/* INPUT GROUP */
.input-group{

  margin-bottom:22px;
}

.input-group label{

  display:block;

  margin-bottom:8px;

  font-size:14px;

  font-weight:600;

  color:#444;
}

.input-group input{

  width:100%;

  padding:18px;

  border:none;

  border-radius:16px;

  background:#f5f5f7;

  font-size:15px;

  outline:none;

  transition:0.3s;
}

.input-group input:focus{

  background:white;

  box-shadow:
  0 0 0 3px rgba(255,65,108,0.15);
}

/* OPTIONS */
.form-options{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:28px;

  font-size:14px;
}

.remember{

  display:flex;

  align-items:center;

  gap:8px;

  color:#555;
}

.remember input{

  accent-color:#ff416c;
}

.forgot{

  color:#ff416c;

  text-decoration:none;

  font-weight:600;
}

/* BUTTON */
.login-box button{

  width:100%;

  padding:18px;

  border:none;

  border-radius:18px;

  background:
  linear-gradient(
    135deg,
    #ff416c,
    #ff4b2b
  );

  color:white;

  font-size:17px;

  font-weight:600;

  cursor:pointer;

  transition:0.3s;

  box-shadow:
  0 15px 30px rgba(255,65,108,0.25);
}

.login-box button:hover{

  transform:translateY(-3px);

  box-shadow:
  0 20px 35px rgba(255,65,108,0.35);
}

/* SWITCH */
.switch-page{

  margin-top:25px;

  text-align:center;

  color:#666;

  font-size:15px;
}

.switch-page a{

  color:#ff416c;

  text-decoration:none;

  font-weight:700;
}

/* MOBILE */
@media(max-width:950px){

  .container{

    grid-template-columns:1fr;
  }

  .left{

    padding:60px 35px;
  }

  .left h1{

    font-size:48px;
  }

  .right{

    padding:45px 25px 55px;
  }
}

@media(max-width:550px){

  body{
    padding:15px;
  }

  .container{

    border-radius:25px;
  }

  .left{

    padding:50px 25px;
  }

  .left h1{

    font-size:40px;
  }

  .login-box h2{

    font-size:34px;
  }
}

</style>

</head>

<body>

<div class="container">

  <!-- LEFT -->
  <div class="left">

    <div class="left-content">

      <h1>
        Welcome Back
      </h1>

      <p>
        Login and continue your premium FlirtyFly experience with secure access and exclusive live connections.
      </p>

      <div class="host-badge">

        ✨ Trusted by thousands of users

      </div>

    </div>

  </div>

  <!-- RIGHT -->
  <div class="right">

    <form
      class="login-box"
      id="loginForm"
    >

      <h2>Login</h2>

      <p class="sub-text">
        Access your FlirtyFly account
      </p>

      <div class="input-group">

        <label>
          Mobile Number
        </label>

        <input
          type="tel"
          name="mobile"
          id="mobile"
          placeholder="Enter mobile number"
          required
        >

      </div>

      <div class="input-group">

        <label>
          Password
        </label>

        <input
          type="password"
          name="password"
          id="password"
          placeholder="Enter password"
          required
        >

      </div>

      <div class="form-options">

        <label class="remember">

          <input type="checkbox">

          Remember me

        </label>

        <a
          href="#"
          class="forgot"
        >
          Forgot Password?
        </a>

      </div>

      <button type="submit">

        Login

      </button>

      <p class="switch-page">

        Don't have an account?

        <a href="/register.html">

          Register

        </a>

      </p>

    </form>

  </div>

</div>

<script>

document.getElementById(
  "loginForm"
).addEventListener("submit",

async function(e){

  e.preventDefault();

  const mobile =
    document.getElementById(
      "mobile"
    ).value;

  const password =
    document.getElementById(
      "password"
    ).value;

  const response = await fetch(

    "/login",

    {

      method:"POST",

      headers:{
        "Content-Type":
        "application/json"
      },

      body:JSON.stringify({

        mobile,
        password

      })

    }

  );

  const data =
    await response.json();

  if(data.success){

    localStorage.setItem(

      "userName",

      data.user.name

    );

    localStorage.setItem(

      "userMobile",

      data.user.mobile

    );

    window.location.href =
    "/user.html";

  }else{

    alert(
      "Invalid Mobile or Password"
    );

  }

});

</script>

</body>

</html>

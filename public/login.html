<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💋</text></svg>">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#ff2d75">

<title>Login — FlirtyFly 💋</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
  href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,700;1,800&display=swap"
  rel="stylesheet"
>

<link rel="stylesheet" href="/auth.css">

</head>

<body>

<div class="auth">

  <!-- LEFT -->
  <aside class="auth-side">

    <a class="brand" href="/">FlirtyFly 💋</a>

    <h1>
      Welcome <em>Back</em>
    </h1>

    <p>
      Login and continue your premium FlirtyFly 💋 experience with secure access and exclusive live connections.
    </p>

    <div class="side-extra">

      <div class="badge">
        ✨ Trusted by thousands of users
      </div>

    </div>

  </aside>

  <!-- RIGHT -->
  <main class="auth-main">

    <form
      class="auth-card"
      id="loginForm"
    >

      <h2>Login</h2>

      <p class="sub">
        Access your FlirtyFly 💋 account
      </p>

      <div class="field">

        <label for="mobile">
          Mobile Number
        </label>

        <div class="control">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>

          <input
            type="tel"
            name="mobile"
            id="mobile"
            placeholder="Enter mobile number"
            inputmode="numeric"
            autocomplete="tel"
            required
          >

        </div>

      </div>

      <div class="field">

        <label for="password">
          Password
        </label>

        <div class="control has-toggle">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>

          <input
            type="password"
            name="password"
            id="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
          >

          <button type="button" class="toggle-password" aria-label="Show password">
            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.600-7 10-7 10 7 10 7-3.600 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.600 5.200A10.900 10.900 0 0 1 12 5c6.400 0 10 7 10 7a17 17 0 0 1-3.300 4.200"/><path d="M6.300 6.300A17.200 17.200 0 0 0 2 12s3.600 7 10 7a10.700 10.700 0 0 0 4.300-.900"/><path d="M9.900 9.900a3 3 0 0 0 4.200 4.200"/></svg>
          </button>

        </div>

      </div>

      <div class="row-between">

        <label class="check">

          <input type="checkbox">

          Remember me

        </label>

        <a href="mailto:flirtyfly.support@gmail.com?subject=Password%20reset">
          Forgot Password?
        </a>

      </div>

      <p class="form-message" id="formMessage" role="alert"></p>

      <button type="submit" class="submit" id="submitBtn">
        Login
      </button>

      <p class="switch">

        Don't have an account?

        <a href="/register.html">
          Register
        </a>

      </p>

    </form>

  </main>

</div>

<script src="/auth.js"></script>

<script>

document.getElementById(
  "loginForm"
).addEventListener("submit",

async function(e){

  e.preventDefault();

  clearMessage();

  const button =
    document.getElementById("submitBtn");

  const mobile =
    document.getElementById(
      "mobile"
    ).value.trim();

  const password =
    document.getElementById(
      "password"
    ).value;

  setBusy(button, "Logging in...");

  try{

    const response = await fetch(

      "/login",

      {

        method:"POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({

          mobile,
          password

        })

      }

    );

    const data =
      await response.json();

    if(data.success){

      localStorage.setItem(

        "userName",

        data.user.name

      );

      localStorage.setItem(

        "userMobile",

        data.user.mobile

      );

      window.location.href =
      "/user.html";

      return;

    }

    showMessage(
      "Invalid Mobile or Password"
    );

  }catch(error){

    console.log(error);

    showMessage(
      "Could not reach the server. Please try again."
    );

  }

  setBusy(button);

});

</script>

</body>

</html>

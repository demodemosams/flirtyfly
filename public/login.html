<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - FlirtyFly</title>

  <link rel="stylesheet" href="login.css">
</head>

<body>

  <div class="container">

    <!-- LEFT -->
    <div class="left">

      <h1>Welcome Back</h1>

      <p>
        Login and continue your premium FlirtyFly experience
      </p>

    </div>

    <!-- RIGHT -->
    <div class="right">

      <form
  class="login-box"
  id="loginForm"
>

  <h2>Login</h2>

  <input
    type="tel"
    name="mobile"
    id="mobile"
    placeholder="Mobile Number"
    required
  >

  <input
    type="password"
    name="password"
    id="password"
    placeholder="Password"
    required
  >

  <button type="submit">
    Login
  </button>

  <p class="switch-page">

    Don't have an account?

    <a href="/register.html">
      Register
    </a>

  </p>

</form>

    </div>

  </div>

<script>

document.getElementById(
  "loginForm"
).addEventListener("submit",

async function(e){

  e.preventDefault();

  const mobile =
    document.getElementById(
      "mobile"
    ).value;

  const password =
    document.getElementById(
      "password"
    ).value;

  const response = await fetch(

    "/login",

    {

      method:"POST",

      headers:{
        "Content-Type":
        "application/json"
      },

      body:JSON.stringify({

        mobile,
        password

      })

    }

  );

  const data =
    await response.json();

  if(data.success){

    localStorage.setItem(

      "userName",

      data.user.name

    );

    localStorage.setItem(

      "userMobile",

      data.user.mobile

    );

    window.location.href =
  "/user.html";

  }else{

    alert(
      "Invalid Mobile or Password"
    );

  }

});

</script>



</div>

</body>

</html>

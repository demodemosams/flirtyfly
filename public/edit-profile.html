<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Edit Profile - FlirtyFly</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  min-height:100vh;

  font-family:Segoe UI,sans-serif;

  background:
  linear-gradient(
    135deg,
    #0f172a,
    #1e293b,
    #111827
  );

  display:flex;

  justify-content:center;

  align-items:center;

  padding:30px;

  overflow:hidden;

  color:white;
}

/* BACKGROUND GLOW */
body::before{

  content:"";

  position:absolute;

  width:400px;
  height:400px;

  background:
  rgba(255,64,129,0.18);

  border-radius:50%;

  top:-150px;
  right:-120px;

  filter:blur(80px);
}

body::after{

  content:"";

  position:absolute;

  width:350px;
  height:350px;

  background:
  rgba(99,102,241,0.15);

  border-radius:50%;

  bottom:-120px;
  left:-100px;

  filter:blur(80px);
}

/* MAIN CARD */
.page-container{

  position:relative;

  z-index:2;

  width:100%;

  max-width:750px;

  background:
  rgba(255,255,255,0.08);

  backdrop-filter:blur(22px);

  border:1px solid rgba(255,255,255,0.08);

  border-radius:35px;

  padding:45px;

  box-shadow:
  0 25px 60px rgba(0,0,0,0.35);
}

/* HEADER */
.profile-header{

  display:flex;

  align-items:center;

  gap:22px;

  margin-bottom:35px;
}

/* PROFILE IMAGE */
.profile-image{

  width:95px;
  height:95px;

  border-radius:28px;

  background:
  linear-gradient(
    135deg,
    #ff4081,
    #ff6b6b
  );

  display:flex;

  justify-content:center;
  align-items:center;

  font-size:34px;

  font-weight:bold;

  box-shadow:
  0 15px 35px rgba(255,64,129,0.35);
}

/* TEXT */
.header-text h1{

  font-size:38px;

  margin-bottom:8px;
}

.header-text p{

  color:#cbd5e1;

  font-size:15px;

  line-height:1.6;
}

/* FORM */
.form-group{

  margin-bottom:25px;
}

.form-group label{

  display:block;

  margin-bottom:10px;

  font-size:15px;

  font-weight:600;

  color:#f1f5f9;
}

/* INPUTS */
input,
textarea{

  width:100%;

  padding:18px 20px;

  border:none;

  border-radius:18px;

  background:
  rgba(255,255,255,0.08);

  border:1px solid rgba(255,255,255,0.06);

  color:white;

  font-size:15px;

  outline:none;

  transition:0.3s;
}

textarea{

  resize:none;

  min-height:130px;
}

input::placeholder,
textarea::placeholder{

  color:#94a3b8;
}

input:focus,
textarea:focus{

  border:1px solid rgba(255,64,129,0.4);

  box-shadow:
  0 0 0 4px rgba(255,64,129,0.15);
}

/* BUTTON */
button{

  width:100%;

  padding:18px;

  border:none;

  border-radius:20px;

  background:
  linear-gradient(
    135deg,
    #ff4081,
    #ff6b6b
  );

  color:white;

  font-size:17px;

  font-weight:600;

  cursor:pointer;

  transition:0.3s;

  box-shadow:
  0 18px 35px rgba(255,64,129,0.35);
}

button:hover{

  transform:translateY(-4px);

  box-shadow:
  0 22px 40px rgba(255,64,129,0.45);
}

/* BOTTOM */
.bottom-note{

  margin-top:22px;

  text-align:center;

  color:#94a3b8;

  font-size:14px;
}

/* MOBILE */
@media(max-width:700px){

  .page-container{

    padding:30px 22px;
  }

  .profile-header{

    flex-direction:column;

    align-items:flex-start;
  }

  .header-text h1{

    font-size:30px;
  }

  .profile-image{

    width:80px;
    height:80px;

    font-size:28px;
  }
}

</style>

</head>

<body>

<div class="page-container">

  <!-- HEADER -->
  <div class="profile-header">

    <div class="profile-image">

      ✨

    </div>

    <div class="header-text">

      <h1>
        Edit Profile
      </h1>

      <p>
        Update your FlirtyFly profile information and personalize your experience.
      </p>

    </div>

  </div>

  <!-- NAME -->
  <div class="form-group">

    <label>
      Full Name
    </label>

    <input
      type="text"
      id="profileName"
      placeholder="Enter your name"
    >

  </div>

  <!-- BIO -->
  <div class="form-group">

    <label>
      Bio
    </label>

    <textarea
      id="profileBio"
      placeholder="Write something about yourself..."
    ></textarea>

  </div>

  <!-- BUTTON -->
  <button
    onclick="saveProfile()"
  >

    Save Profile

  </button>

  <div class="bottom-note">

    Your profile changes will be updated instantly.

  </div>

</div>

<script>

document.getElementById(
  "profileName"
).value =

  localStorage.getItem(
    "userName"
  ) || "";

document.getElementById(
  "profileBio"
).value =

  localStorage.getItem(
    "userBio"
  ) || "";

async function saveProfile(){

  const updatedName =

    document.getElementById(
      "profileName"
    ).value;

  const updatedBio =

    document.getElementById(
      "profileBio"
    ).value;

  const mobile =

    localStorage.getItem(
      "userMobile"
    );

  const response = await fetch(

    "/update-profile",

    {

      method:"POST",

      headers:{
        "Content-Type":
        "application/json"
      },

      body:JSON.stringify({

        mobile,
        name:updatedName,
        bio:updatedBio

      })

    }

  );

  const data =
    await response.json();

  if(data.success){

    localStorage.setItem(
      "userName",
      updatedName
    );

    localStorage.setItem(
      "userBio",
      updatedBio
    );

    alert(
      "Profile Updated Successfully"
    );

    window.location.href =
      "/user.html";

  }else{

    alert(
      "Profile Update Failed"
    );

  }

}

</script>

</body>

</html>

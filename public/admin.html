<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  FlirtyFly Admin Dashboard
</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet"
>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  font-family:'Poppins',sans-serif;

  background:
  linear-gradient(
    135deg,
    #0f172a,
    #111827,
    #1e293b
  );

  color:white;

  min-height:100vh;

  display:flex;

  overflow-x:hidden;
}

/* SIDEBAR */
.sidebar{

  width:290px;

  background:
  rgba(255,255,255,0.05);

  backdrop-filter:blur(20px);

  border-right:
  1px solid rgba(255,255,255,0.08);

  padding:35px 25px;

  position:fixed;

  top:0;
  left:0;
  bottom:0;

  z-index:100;
}

.sidebar h1{

  font-size:36px;

  margin-bottom:45px;

  background:
  linear-gradient(
    135deg,
    #ff4f87,
    #ff7b54
  );

  -webkit-background-clip:text;

  -webkit-text-fill-color:transparent;
}

.sidebar ul{

  list-style:none;
}

.menu-item{

  padding:18px 20px;

  border-radius:18px;

  margin-bottom:15px;

  cursor:pointer;

  transition:0.3s;

  font-weight:600;

  background:
  rgba(255,255,255,0.04);
}

.menu-item:hover{

  transform:translateX(5px);

  background:
  rgba(255,255,255,0.08);
}

.active-menu{

  background:
  linear-gradient(
    135deg,
    #ff4f87,
    #ff7b54
  );

  box-shadow:
  0 15px 35px rgba(255,79,135,0.35);
}

/* MAIN */
.main{

  flex:1;

  margin-left:290px;

  padding:30px;
}

/* TOPBAR */
.topbar{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:35px;
}

.topbar h2{

  font-size:36px;
}

.admin-badge{

  background:
  linear-gradient(
    135deg,
    #ff4f87,
    #ff7b54
  );

  padding:12px 22px;

  border-radius:50px;

  font-size:14px;

  font-weight:600;
}

/* STATS */
.stats{

  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(220px,1fr));

  gap:25px;

  margin-bottom:35px;
}

.stat-card{

  background:
  rgba(255,255,255,0.06);

  backdrop-filter:blur(20px);

  border:
  1px solid rgba(255,255,255,0.08);

  border-radius:30px;

  padding:30px;

  transition:0.3s;
}

.stat-card:hover{

  transform:translateY(-5px);
}

.stat-card h1{

  font-size:42px;

  margin-bottom:10px;

  color:#ff7b54;
}

.stat-card p{

  color:#cbd5e1;
}

/* SECTION */
.section{

  background:
  rgba(255,255,255,0.06);

  border:
  1px solid rgba(255,255,255,0.08);

  backdrop-filter:blur(20px);

  border-radius:35px;

  padding:30px;

  margin-bottom:30px;
}

.section h2{

  margin-bottom:25px;

  font-size:30px;
}

/* HOST FORM */
.host-form{

  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(220px,1fr));

  gap:20px;
}

.host-form input{

  padding:18px;

  border:none;

  border-radius:18px;

  background:
  rgba(255,255,255,0.08);

  color:white;

  outline:none;

  font-size:15px;
}

.host-form input::placeholder{

  color:#cbd5e1;
}

.host-form button{

  border:none;

  border-radius:18px;

  background:
  linear-gradient(
    135deg,
    #ff4f87,
    #ff7b54
  );

  color:white;

  font-size:16px;

  font-weight:600;

  cursor:pointer;

  padding:18px;

  transition:0.3s;
}

.host-form button:hover{

  transform:translateY(-4px);

  box-shadow:
  0 18px 35px rgba(255,79,135,0.3);
}

/* ROW */
.row{

  background:
  rgba(255,255,255,0.05);

  border:
  1px solid rgba(255,255,255,0.06);

  border-radius:25px;

  padding:20px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:20px;

  transition:0.3s;
}

.row:hover{

  transform:translateY(-4px);

  background:
  rgba(255,255,255,0.08);
}

.left{

  display:flex;

  align-items:center;

  gap:18px;
}

.left img{

  width:85px;
  height:85px;

  border-radius:22px;

  object-fit:cover;
}

.left h3{

  font-size:22px;

  margin-bottom:6px;
}

.left p{

  color:#cbd5e1;

  font-size:14px;

  margin-top:3px;
}

/* BUTTON */
.delete{

  border:none;

  padding:14px 20px;

  border-radius:16px;

  background:
  linear-gradient(
    135deg,
    #ff416c,
    #ff4b2b
  );

  color:white;

  font-weight:600;

  cursor:pointer;
}

/* MOBILE */
@media(max-width:950px){

  body{
    flex-direction:column;
  }

  .sidebar{

    width:100%;

    position:relative;

    border-right:none;
  }

  .main{

    margin-left:0;
  }

  .topbar{

    flex-direction:column;

    align-items:flex-start;

    gap:15px;
  }

  .row{

    flex-direction:column;

    align-items:flex-start;

    gap:20px;
  }

}

</style>

</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar">

<h1>
  FlirtyFly
</h1>

<ul>

<li
  class="menu-item active-menu"
  onclick="showDashboard(this)"
>
  Dashboard
</li>

<li
  class="menu-item"
  onclick="showCreateHost(this)"
>
  Create Host
</li>

<li
  class="menu-item"
  onclick="showUsers(this)"
>
  Users
</li>

<li
  class="menu-item"
  onclick="showHosts(this)"
>
  Hosts
</li>

</ul>

</aside>

<!-- MAIN -->
<main class="main">

<!-- TOPBAR -->
<div class="topbar">

<h2 id="pageTitle">
  Dashboard
</h2>

<div class="admin-badge">
  Super Admin
</div>

</div>

<!-- DASHBOARD -->
<div id="dashboardSection">

<div class="stats">

<div class="stat-card">

<h1 id="totalUsers">
  0
</h1>

<p>
  Total Users
</p>

</div>

<div class="stat-card">

<h1 id="todayUsers">
  0
</h1>

<p>
  Today's Users
</p>

</div>

<div class="stat-card">

<h1 id="totalHosts">
  0
</h1>

<p>
  Total Hosts
</p>

</div>

<div class="stat-card">

<h1 id="onlineHosts">
  0
</h1>

<p>
  Online Hosts
</p>

</div>

<div class="stat-card">

<h1 id="totalRevenue">
  ₹0
</h1>

<p>
  Revenue
</p>

</div>

</div>

</div>

<!-- CREATE HOST -->
<div
  class="section"
  id="createHostSection"
  style="display:none;"
>

<h2>
  Create Host
</h2>

<form
  class="host-form"
  action="/create-host"
  method="POST"
  enctype="multipart/form-data"
>

<input
  type="text"
  name="name"
  placeholder="Host Name"
  required
>

<input
  type="tel"
  name="mobile"
  placeholder="Host Mobile Number"
  required
>

<input
  type="password"
  name="password"
  placeholder="Password"
  required
>

<input
  type="file"
  name="image"
  required
>

<button type="submit">

  Create Host

</button>

</form>

</div>

<!-- USERS -->
<div
  class="section"
  id="usersSection"
  style="display:none;"
>

<h2>
  All Users
</h2>

<div id="usersList"></div>

</div>

<!-- HOSTS -->
<div
  class="section"
  id="hostsSection"
  style="display:none;"
>

<h2>
  All Hosts
</h2>

<div id="hostsList"></div>

</div>

</main>

<script>

/* ADMIN AUTH */
const adminLoggedIn =

localStorage.getItem(
  "adminLoggedIn"
);

if(adminLoggedIn !== "true"){

  window.location.href =
  "/admin-login.html";

}

/* ACTIVE MENU */
function setActive(element){

  document.querySelectorAll(
    ".menu-item"
  ).forEach((item)=>{

    item.classList.remove(
      "active-menu"
    );

  });

  element.classList.add(
    "active-menu"
  );

}

/* HIDE SECTIONS */
function hideSections(){

  document.getElementById(
    "dashboardSection"
  ).style.display = "none";

  document.getElementById(
    "createHostSection"
  ).style.display = "none";

  document.getElementById(
    "usersSection"
  ).style.display = "none";

  document.getElementById(
    "hostsSection"
  ).style.display = "none";

}

/* SHOW DASHBOARD */
function showDashboard(element){

  setActive(element);

  hideSections();

  document.getElementById(
    "dashboardSection"
  ).style.display = "block";

  document.getElementById(
    "pageTitle"
  ).innerText =

  "Dashboard";

}

/* SHOW CREATE HOST */
function showCreateHost(element){

  setActive(element);

  hideSections();

  document.getElementById(
    "createHostSection"
  ).style.display = "block";

  document.getElementById(
    "pageTitle"
  ).innerText =

  "Create Host";

}

/* SHOW USERS */
function showUsers(element){

  setActive(element);

  hideSections();

  document.getElementById(
    "usersSection"
  ).style.display = "block";

  document.getElementById(
    "pageTitle"
  ).innerText =

  "Users";

}

/* SHOW HOSTS */
function showHosts(element){

  setActive(element);

  hideSections();

  document.getElementById(
    "hostsSection"
  ).style.display = "block";

  document.getElementById(
    "pageTitle"
  ).innerText =

  "Hosts";

}

/* LOAD STATS */
async function loadStats(){

  const response = await fetch(
    "/admin-stats"
  );

  const stats =
    await response.json();

  document.getElementById(
    "totalUsers"
  ).innerText =
  stats.totalUsers;

  document.getElementById(
    "todayUsers"
  ).innerText =
  stats.todayUsers;

  document.getElementById(
    "totalHosts"
  ).innerText =
  stats.totalHosts;

  document.getElementById(
    "onlineHosts"
  ).innerText =
  stats.onlineHosts;

  document.getElementById(
    "totalRevenue"
  ).innerText =
  `₹${stats.revenue}`;

}

/* LOAD USERS */
async function loadUsers(){

  const response = await fetch(
    "/get-users"
  );

  const users =
    await response.json();

  const usersList =

    document.getElementById(
      "usersList"
    );

  usersList.innerHTML = "";

  users.forEach((user)=>{

    usersList.innerHTML += `

      <div class="row">

        <div class="left">

          <img
            src="https://ui-avatars.com/api/?name=${user.name}"
          >

          <div>

            <h3>
              ${user.name}
            </h3>

            <p>
              ${user.mobile}
            </p>

            <p>
              ${user.bio || "No Bio"}
            </p>

          </div>

        </div>

        <button
          class="delete"
          onclick="deleteUser('${user._id}')"
        >

          Delete

        </button>

      </div>

    `;

  });

}

/* DELETE USER */
async function deleteUser(id){

  if(
    !confirm(
      "Delete User?"
    )
  ){
    return;
  }

  await fetch(

    `/delete-user/${id}`,

    {
      method:"DELETE"
    }

  );

  loadUsers();

  loadStats();

}

/* LOAD HOSTS */
async function loadHosts(){

  const response = await fetch(
    "/get-hosts"
  );

  const hosts =
    await response.json();

  const hostsList =

    document.getElementById(
      "hostsList"
    );

  hostsList.innerHTML = "";

  hosts.forEach((host)=>{

    hostsList.innerHTML += `

      <div class="row">

        <div class="left">

          <img
            src="/uploads/${host.image}"
          >

          <div>

            <h3>
              ${host.name}
            </h3>

            <p>
              ${host.mobile}
            </p>

            <p>

              Status:
              ${
                host.status || "Offline"
              }

            </p>

          </div>

        </div>

        <button
          class="delete"
          onclick="deleteHost('${host._id}')"
        >

          Delete

        </button>

      </div>

    `;

  });

}

/* DELETE HOST */
async function deleteHost(id){

  if(
    !confirm(
      "Delete Host?"
    )
  ){
    return;
  }

  await fetch(

    `/delete-host/${id}`,

    {
      method:"DELETE"
    }

  );

  loadHosts();

  loadStats();

}

/* INITIAL LOAD */
loadStats();

loadUsers();

loadHosts();

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard - FlirtyFly</title>

  <link rel="stylesheet" href="admin.css">
</head>

<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <h1>FlirtyFly</h1>

    <ul>

  <li class="active">
    Create Hosts
  </li>

</ul>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- TOPBAR -->
    <div class="topbar">

      <h2>Host Management</h2>

      <div class="admin-badge">
        Admin Access
      </div>

    </div>

    

    <!-- HOST MANAGEMENT -->
    <div class="section">

      <div class="section-top">

        <h2>Host Management</h2>

      </div>

      <!-- CREATE HOST -->
      <div class="create-host">

        <h3>Create Host Account</h3>

        <form
          action="http://localhost:3000/create-host"
          method="POST"
          enctype="multipart/form-data"
        >

          <input
            type="text"
            name="name"
            placeholder="Host Name"
            required
          >

          <input
  type="tel"
  name="mobile"
  placeholder="Host Mobile Number"
  required
>

          <input
            type="password"
            name="password"
            placeholder="Password"
            required
          >

          <input
            type="file"
            name="image"
            required
          >

          <button
            type="submit"
            class="add-btn"
          >
            Create Host
          </button>

        </form>

      </div>

      <div id="hostList"></div>

    </div>

    
    

  </main>

<script>

async function loadHosts(){

  const response = await fetch(
    "http://localhost:3000/get-hosts"
  );

  const hosts = await response.json();

  const hostList = document.getElementById("hostList");

  hostList.innerHTML = "";

  hosts.forEach((host) => {

    hostList.innerHTML += `

      <div class="row">

        <div class="left">

          <img src="/uploads/${host.image}">

          <div>

            <h3>${host.name}</h3>

            <p>${host.email}</p>

          </div>

        </div>

        <div class="actions">

          

          <button
            class="delete"
            onclick="deleteHost('${host._id}')"
          >
            Delete
          </button>

        </div>

      </div>

    `;

  });

}

async function deleteHost(id){

  const response = await fetch(

    `http://localhost:3000/delete-host/${id}`,

    {
      method: "DELETE"
    }

  );

  const message = await response.text();

  alert(message);

  loadHosts();

}

loadHosts();

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Admin Dashboard - FlirtyFly</title>

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
  rel="stylesheet"
>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  font-family:'Poppins',sans-serif;

  background:
  linear-gradient(
    135deg,
    #0f172a,
    #111827,
    #1e293b
  );

  min-height:100vh;

  display:flex;

  color:white;

  overflow-x:hidden;
}

/* SIDEBAR */
.sidebar{

  width:280px;

  background:
  rgba(255,255,255,0.06);

  backdrop-filter:blur(20px);

  border-right:
  1px solid rgba(255,255,255,0.08);

  padding:35px 25px;

  position:fixed;

  top:0;
  left:0;
  bottom:0;

  z-index:100;
}

.sidebar h1{

  font-size:34px;

  margin-bottom:45px;

  background:
  linear-gradient(
    135deg,
    #ff4f87,
    #ff7b54
  );

  -webkit-background-clip:text;

  -webkit-text-fill-color:transparent;
}

.sidebar ul{

  list-style:none;
}

.menu-item{

  padding:18px 20px;

  border-radius:18px;

  margin-bottom:15px;

  cursor:pointer;

  font-weight:600;

  transition:0.3s;

  background:
  rgba(255,255,255,0.04);
}

.menu-item:hover{

  transform:translateX(5px);

  background:
  rgba(255,255,255,0.08);
}

.active-menu{

  background:
  linear-gradient(
    135deg,
    #ff4f87,
    #ff7b54
  );

  box-shadow:
  0 15px 35px rgba(255,79,135,0.35);
}

/* MAIN */
.main{

  flex:1;

  margin-left:280px;

  padding:30px;
}

/* TOPBAR */
.topbar{

  background:
  rgba(255,255,255,0.06);

  backdrop-filter:blur(20px);

  border:
  1px solid rgba(255,255,255,0.08);

  border-radius:30px;

  padding:25px 30px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:35px;
}

.topbar h2{

  font-size:32px;
}

.admin-badge{

  background:
  linear-gradient(
    135deg,
    #ff4f87,
    #ff7b54
  );

  padding:12px 22px;

  border-radius:50px;

  font-size:14px;

  font-weight:600;
}

/* SECTION */
.section{

  background:
  rgba(255,255,255,0.06);

  backdrop-filter:blur(20px);

  border:
  1px solid rgba(255,255,255,0.08);

  border-radius:35px;

  padding:35px;
}

.section-top{

  margin-bottom:30px;
}

.section-top h2{

  font-size:30px;
}

/* CREATE HOST */
.create-host{

  margin-bottom:40px;
}

.create-host h3{

  margin-bottom:25px;

  font-size:24px;
}

.create-host form{

  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(220px,1fr));

  gap:20px;
}

/* INPUTS */
.create-host input{

  padding:18px;

  border:none;

  border-radius:18px;

  background:
  rgba(255,255,255,0.08);

  color:white;

  outline:none;

  font-size:15px;
}

.create-host input::placeholder{

  color:#cbd5e1;
}

/* FILE INPUT */
.create-host input[type="file"]{

  padding:14px;
}

/* BUTTON */
.add-btn{

  border:none;

  border-radius:18px;

  background:
  linear-gradient(
    135deg,
    #ff4f87,
    #ff7b54
  );

  color:white;

  font-size:16px;

  font-weight:600;

  cursor:pointer;

  transition:0.3s;

  padding:18px;
}

.add-btn:hover{

  transform:translateY(-4px);

  box-shadow:
  0 18px 35px rgba(255,79,135,0.3);
}

/* HOST ROW */
.row{

  background:
  rgba(255,255,255,0.05);

  border:
  1px solid rgba(255,255,255,0.06);

  border-radius:25px;

  padding:20px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:20px;

  transition:0.3s;
}

.row:hover{

  transform:translateY(-4px);

  background:
  rgba(255,255,255,0.08);
}

/* LEFT */
.left{

  display:flex;

  align-items:center;

  gap:18px;
}

.left img{

  width:90px;
  height:90px;

  border-radius:24px;

  object-fit:cover;
}

.left h3{

  font-size:22px;

  margin-bottom:6px;
}

.left p{

  color:#cbd5e1;

  font-size:14px;
}

/* ACTIONS */
.actions{

  display:flex;

  gap:15px;
}

/* DELETE */
.delete{

  border:none;

  padding:14px 22px;

  border-radius:16px;

  background:
  linear-gradient(
    135deg,
    #ff416c,
    #ff4b2b
  );

  color:white;

  font-weight:600;

  cursor:pointer;

  transition:0.3s;
}

.delete:hover{

  transform:translateY(-3px);
}

/* PAYMENTS */
#paymentsSection h2{

  margin-bottom:30px;

  font-size:30px;
}

/* MOBILE */
@media(max-width:950px){

  body{

    flex-direction:column;
  }

  .sidebar{

    width:100%;

    position:relative;

    border-right:none;

    border-bottom:
    1px solid rgba(255,255,255,0.08);
  }

  .main{

    margin-left:0;
  }

  .topbar{

    flex-direction:column;

    align-items:flex-start;

    gap:15px;
  }

  .row{

    flex-direction:column;

    align-items:flex-start;

    gap:20px;
  }

  .actions{

    width:100%;
  }

  .delete{

    width:100%;
  }
}

</style>

</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar">

<h1>
  FlirtyFly
</h1>

<ul>

<li
  class="menu-item active-menu"
  id="hostsMenu"
  onclick="showHosts(this)"
>
  Create Hosts
</li>

<li
  class="menu-item"
  id="paymentsMenu"
  onclick="showPayments(this)"
>
  Payments
</li>

</ul>

</aside>

<!-- MAIN -->
<main class="main">

<!-- TOPBAR -->
<div class="topbar">

<h2 id="pageTitle">
  Host Management
</h2>

<div class="admin-badge">
  Admin Access
</div>

</div>

<!-- SECTION -->
<div class="section">

<!-- CREATE HOST -->
<div class="create-host">

<h3>
  Create Host Account
</h3>

<form
  action="/create-host"
  method="POST"
  enctype="multipart/form-data"
>

<input
  type="text"
  name="name"
  placeholder="Host Name"
  required
>

<input
  type="tel"
  name="mobile"
  placeholder="Host Mobile Number"
  required
>

<input
  type="password"
  name="password"
  placeholder="Password"
  required
>

<input
  type="file"
  name="image"
  required
>

<button
  type="submit"
  class="add-btn"
>

  Create Host

</button>

</form>

</div>

<!-- HOST LIST -->
<div id="hostList"></div>

<!-- PAYMENTS -->
<div
  id="paymentsSection"
  style="display:none;"
>

<h2>
  Subscription Payments
</h2>

<div id="paymentsList"></div>

</div>

</div>

</main>

<script>

/* LOAD HOSTS */
async function loadHosts(){

  const response = await fetch(
    "/get-hosts"
  );

  const hosts =
    await response.json();

  const hostList =

    document.getElementById(
      "hostList"
    );

  hostList.innerHTML = "";

  hosts.forEach((host)=>{

    hostList.innerHTML += `

      <div class="row">

        <div class="left">

          <img
            src="/uploads/${host.image}"
          >

          <div>

            <h3>
              ${host.name}
            </h3>

            <p>
              ${host.mobile}
            </p>

            <p>

              Status:
              ${
                host.status || "Offline"
              }

            </p>

          </div>

        </div>

        <div class="actions">

          <button
            class="delete"
            onclick="deleteHost('${host._id}')"
          >

            Delete

          </button>

        </div>

      </div>

    `;

  });

}

/* DELETE HOST */
async function deleteHost(id){

  if(
    !confirm(
      "Delete this host?"
    )
  ){
    return;
  }

  const response = await fetch(

    `/delete-host/${id}`,

    {
      method:"DELETE"
    }

  );

  const message =
    await response.text();

  alert(message);

  loadHosts();

}

/* SHOW PAYMENTS */
async function showPayments(element){

  setActiveMenu(element);

  document.querySelector(
    ".create-host"
  ).style.display = "none";

  document.getElementById(
    "hostList"
  ).style.display = "none";

  document.getElementById(
    "paymentsSection"
  ).style.display = "block";

  document.getElementById(
    "pageTitle"
  ).innerText =

  "Payments";

  const response = await fetch(
    "/get-payments"
  );

  const payments =
    await response.json();

  const paymentsList =

    document.getElementById(
      "paymentsList"
    );

  paymentsList.innerHTML = "";

  if(payments.length === 0){

    paymentsList.innerHTML = `

      <div class="row">

        <div class="left">

          <div>

            <h3>
              No Payments Yet
            </h3>

          </div>

        </div>

      </div>

    `;

    return;

  }

  payments.forEach((payment)=>{

    paymentsList.innerHTML += `

      <div class="row">

        <div class="left">

          <div>

            <h3>
              ${payment.plan}
            </h3>

            <p>
              ${payment.userName || "User"}
            </p>

            <p>
              ${payment.userMobile}
            </p>

            <p>

              ₹${payment.amount}

            </p>

          </div>

        </div>

      </div>

    `;

  });

}

/* SHOW HOSTS */
function showHosts(element){

  setActiveMenu(element);

  document.querySelector(
    ".create-host"
  ).style.display = "block";

  document.getElementById(
    "hostList"
  ).style.display = "block";

  document.getElementById(
    "paymentsSection"
  ).style.display = "none";

  document.getElementById(
    "pageTitle"
  ).innerText =

  "Host Management";

}

/* ACTIVE MENU */
function setActiveMenu(element){

  document.querySelectorAll(
    ".menu-item"
  ).forEach((item)=>{

    item.classList.remove(
      "active-menu"
    );

  });

  element.classList.add(
    "active-menu"
  );

}

/* ADMIN AUTH */
const adminLoggedIn =

  localStorage.getItem(
    "adminLoggedIn"
  );

if(adminLoggedIn !== "true"){

  window.location.href =
  "/admin-login.html";

}

/* INITIAL LOAD */
loadHosts();

</script>

</body>

</html>

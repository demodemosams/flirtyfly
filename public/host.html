<!-- PREMIUM HOST DASHBOARD UI -->

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  font-family:Segoe UI,sans-serif;

  background:
  linear-gradient(
    135deg,
    #0f172a,
    #111827,
    #1e293b
  );

  color:white;

  min-height:100vh;

  overflow-x:hidden;
}

/* LAYOUT */
.layout{

  display:flex;

  min-height:100vh;
}

/* SIDEBAR */
.sidebar{

  width:280px;

  background:
  rgba(255,255,255,0.05);

  backdrop-filter:blur(18px);

  border-right:
  1px solid rgba(255,255,255,0.08);

  padding:35px 25px;
}

.sidebar h1{

  font-size:34px;

  margin-bottom:50px;

  color:#ff5f8f;
}

.sidebar ul{

  list-style:none;
}

.menu-item{

  padding:18px 22px;

  margin-bottom:15px;

  border-radius:18px;

  cursor:pointer;

  transition:0.3s;

  font-weight:600;

  background:
  rgba(255,255,255,0.04);
}

.menu-item:hover{

  background:
  rgba(255,255,255,0.08);
}

.active-menu{

  background:
  linear-gradient(
    135deg,
    #ff4081,
    #ff6b6b
  );

  box-shadow:
  0 15px 30px rgba(255,64,129,0.35);
}

/* MAIN */
.main{

  flex:1;

  padding:30px;
}

/* TOPBAR */
.topbar{

  display:flex;

  justify-content:space-between;

  align-items:center;

  background:
  rgba(255,255,255,0.06);

  backdrop-filter:blur(16px);

  border:
  1px solid rgba(255,255,255,0.08);

  padding:22px 28px;

  border-radius:28px;

  margin-bottom:30px;
}

/* PROFILE */
.profile{

  display:flex;

  align-items:center;

  gap:18px;
}

.profile img{

  width:75px;
  height:75px;

  border-radius:22px;

  object-fit:cover;

  border:3px solid rgba(255,255,255,0.15);
}

.profile h2{

  font-size:24px;

  margin-bottom:5px;
}

.online-text{

  color:#00e676;

  font-size:14px;

  font-weight:600;
}

/* BUTTONS */
.topbar-buttons{

  display:flex;

  gap:15px;
}

.online-btn,
.logout-btn{

  border:none;

  padding:14px 22px;

  border-radius:16px;

  font-size:15px;

  font-weight:600;

  cursor:pointer;

  transition:0.3s;

  color:white;
}

.online-btn{

  background:
  linear-gradient(
    135deg,
    #00c853,
    #00e676
  );
}

.logout-btn{

  background:
  linear-gradient(
    135deg,
    #ff416c,
    #ff4b2b
  );
}

.online-btn:hover,
.logout-btn:hover{

  transform:translateY(-3px);
}

/* STATS */
.stats{

  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(220px,1fr));

  gap:22px;

  margin-bottom:30px;
}

/* CARD */
.card{

  background:
  rgba(255,255,255,0.06);

  backdrop-filter:blur(18px);

  border:
  1px solid rgba(255,255,255,0.08);

  padding:30px;

  border-radius:28px;

  transition:0.3s;
}

.card:hover{

  transform:translateY(-5px);
}

.card h1{

  font-size:34px;

  margin-bottom:12px;

  color:#ff7aa2;
}

.card p{

  color:#cbd5e1;

  font-size:15px;
}

/* RECENT CALLS */
.recent{

  background:
  rgba(255,255,255,0.06);

  backdrop-filter:blur(18px);

  border:
  1px solid rgba(255,255,255,0.08);

  padding:30px;

  border-radius:30px;
}

.recent h2{

  margin-bottom:25px;

  font-size:28px;
}

/* CALL ROW */
.call-row{

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:18px 20px;

  margin-bottom:15px;

  border-radius:18px;

  background:
  rgba(255,255,255,0.05);

  transition:0.3s;
}

.call-row:hover{

  background:
  rgba(255,255,255,0.08);
}

/* POPUP */
.incoming-popup{

  position:fixed;

  inset:0;

  background:
  rgba(0,0,0,0.65);

  display:flex;

  justify-content:center;

  align-items:center;

  z-index:999;
}

/* POPUP BOX */
.popup-box{

  width:90%;
  max-width:420px;

  background:
  rgba(255,255,255,0.08);

  backdrop-filter:blur(22px);

  border:
  1px solid rgba(255,255,255,0.08);

  padding:35px;

  border-radius:32px;

  text-align:center;

  animation:popup 0.3s ease;
}

@keyframes popup{

  from{

    transform:scale(0.8);
    opacity:0;
  }

  to{

    transform:scale(1);
    opacity:1;
  }
}

.popup-box h2{

  font-size:30px;

  margin-bottom:15px;
}

.popup-box p{

  color:#cbd5e1;

  margin-bottom:30px;

  font-size:16px;
}

/* POPUP BUTTONS */
.popup-buttons{

  display:flex;

  gap:15px;
}

.accept-btn,
.reject-btn{

  flex:1;

  border:none;

  padding:16px;

  border-radius:18px;

  font-size:16px;

  font-weight:600;

  cursor:pointer;

  color:white;

  transition:0.3s;
}

.accept-btn{

  background:
  linear-gradient(
    135deg,
    #00c853,
    #00e676
  );
}

.reject-btn{

  background:
  linear-gradient(
    135deg,
    #ff416c,
    #ff4b2b
  );
}

.accept-btn:hover,
.reject-btn:hover{

  transform:translateY(-3px);
}

/* MOBILE */
@media(max-width:900px){

  .layout{

    flex-direction:column;
  }

  .sidebar{

    width:100%;

    border-right:none;

    border-bottom:
    1px solid rgba(255,255,255,0.08);
  }

  .topbar{

    flex-direction:column;

    align-items:flex-start;

    gap:20px;
  }

  .topbar-buttons{

    width:100%;

    flex-direction:column;
  }

  .online-btn,
  .logout-btn{

    width:100%;
  }

  .call-row{

    flex-direction:column;

    align-items:flex-start;

    gap:10px;
  }
}

</style>

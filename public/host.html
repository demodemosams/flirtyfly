<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  Host Dashboard — FlirtyFly
</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet"
>

<script src="/socket.io/socket.io.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{

  --primary:#ff4f87;
  --secondary:#ff7b54;

  --bg1:#0f172a;
  --bg2:#111827;
  --bg3:#1e293b;

  --card:
  rgba(255,255,255,0.06);

  --border:
  rgba(255,255,255,0.08);

  --text:#ffffff;

  --muted:#cbd5e1;

}

body{

  font-family:'Poppins',sans-serif;

  background:
  linear-gradient(
    135deg,
    var(--bg1),
    var(--bg2),
    var(--bg3)
  );

  color:var(--text);

  min-height:100vh;

  overflow-x:hidden;
}

/* LAYOUT */
.layout{

  display:flex;

  min-height:100vh;
}

/* SIDEBAR */
.sidebar{

  width:280px;

  background:
  rgba(255,255,255,0.05);

  backdrop-filter:blur(20px);

  border-right:
  1px solid var(--border);

  padding:35px 25px;

  position:fixed;

  top:0;
  left:0;
  bottom:0;
}

.logo{

  font-size:34px;

  font-weight:700;

  margin-bottom:45px;

  background:
  linear-gradient(
    135deg,
    var(--primary),
    var(--secondary)
  );

  -webkit-background-clip:text;

  -webkit-text-fill-color:transparent;
}

.sidebar ul{

  list-style:none;
}

.menu-item{

  padding:18px 20px;

  border-radius:18px;

  margin-bottom:15px;

  cursor:pointer;

  transition:0.3s;

  font-weight:600;

  background:
  rgba(255,255,255,0.04);
}

.menu-item:hover{

  transform:translateX(5px);

  background:
  rgba(255,255,255,0.08);
}

.active-menu{

  background:
  linear-gradient(
    135deg,
    var(--primary),
    var(--secondary)
  );

  box-shadow:
  0 15px 35px rgba(255,79,135,0.35);
}

/* MAIN */
.main{

  flex:1;

  margin-left:280px;

  padding:30px;
}

/* TOPBAR */
.topbar{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:35px;
}

/* PROFILE */
.host-profile{

  display:flex;

  align-items:center;

  gap:15px;

  background:var(--card);

  border:
  1px solid var(--border);

  padding:15px 20px;

  border-radius:24px;

  backdrop-filter:blur(20px);
}

.host-profile img{

  width:70px;
  height:70px;

  border-radius:20px;

  object-fit:cover;
}

.host-profile h3{

  font-size:22px;
}

.online-dot{

  color:#00ff95;

  font-size:14px;

  font-weight:600;
}

/* BUTTONS */
.top-actions{

  display:flex;

  gap:12px;
}

.status-btn,
.logout-btn,
.quick-btn{

  border:none;

  padding:14px 20px;

  border-radius:18px;

  color:white;

  font-weight:600;

  cursor:pointer;

  transition:0.3s;
}

.online{

  background:
  linear-gradient(
    135deg,
    #00c853,
    #00e676
  );
}

.offline{

  background:
  linear-gradient(
    135deg,
    #ff5252,
    #ff1744
  );
}

.logout-btn{

  background:
  linear-gradient(
    135deg,
    #ff416c,
    #ff4b2b
  );
}

.quick-btn{

  background:
  linear-gradient(
    135deg,
    var(--primary),
    var(--secondary)
  );
}

.status-btn:hover,
.logout-btn:hover,
.quick-btn:hover{

  transform:translateY(-4px);
}

/* STATS */
.stats{

  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(220px,1fr));

  gap:25px;

  margin-bottom:35px;
}

.stat-card{

  background:var(--card);

  border:
  1px solid var(--border);

  backdrop-filter:blur(20px);

  border-radius:30px;

  padding:30px;

  transition:0.3s;
}

.stat-card:hover{

  transform:translateY(-6px);
}

.stat-card h1{

  font-size:42px;

  margin-bottom:10px;

  color:var(--secondary);
}

.stat-card p{

  color:var(--muted);
}

/* PANEL */
.panel{

  background:var(--card);

  border:
  1px solid var(--border);

  backdrop-filter:blur(20px);

  border-radius:35px;

  padding:30px;
}

.panel h2{

  margin-bottom:25px;

  font-size:28px;
}

/* ROW ITEM */
.row-item{

  display:flex;

  justify-content:space-between;

  align-items:center;

  background:
  rgba(255,255,255,0.04);

  padding:18px 20px;

  border-radius:20px;

  margin-bottom:15px;

  transition:0.3s;
}

.row-item:hover{

  background:
  rgba(255,255,255,0.08);
}

/* QUICK ACTIONS */
.quick-actions{

  display:flex;

  gap:15px;

  margin-bottom:30px;

  flex-wrap:wrap;
}

/* POPUP */
.incoming-popup{

  position:fixed;

  inset:0;

  background:
  rgba(0,0,0,0.6);

  display:none;

  justify-content:center;

  align-items:center;

  z-index:1000;
}

.incoming-popup.open{

  display:flex;
}

.incoming-box{

  width:90%;
  max-width:420px;

  background:
  rgba(255,255,255,0.08);

  backdrop-filter:blur(25px);

  border:
  1px solid rgba(255,255,255,0.1);

  border-radius:35px;

  padding:35px;

  text-align:center;
}

.incoming-box h2{

  font-size:32px;

  margin-bottom:12px;
}

.incoming-box p{

  color:var(--muted);

  margin-bottom:30px;
}

.incoming-btns{

  display:flex;

  gap:15px;
}

.btn{

  flex:1;

  border:none;

  padding:16px;

  border-radius:18px;

  color:white;

  font-weight:600;

  cursor:pointer;
}

.btn-success{

  background:
  linear-gradient(
    135deg,
    #00c853,
    #00e676
  );
}

.btn-danger{

  background:
  linear-gradient(
    135deg,
    #ff416c,
    #ff4b2b
  );
}

/* MOBILE */
@media(max-width:950px){

  .layout{
    flex-direction:column;
  }

  .sidebar{

    width:100%;

    position:relative;

    border-right:none;
  }

  .main{

    margin-left:0;
  }

  .topbar{

    flex-direction:column;

    align-items:flex-start;

    gap:20px;
  }

}

</style>

</head>

<body>

<div class="layout">

<!-- SIDEBAR -->
<aside class="sidebar">

<div class="logo">
  FlirtyFly
</div>

<ul>

<li
  class="menu-item active-menu"
>
  Dashboard
</li>

</ul>

</aside>

<!-- MAIN -->
<main class="main">

<!-- TOPBAR -->
<div class="topbar">

<div class="host-profile">

<img id="hostImage">

<div>

<h3 id="hostName"></h3>

<span
  class="online-dot"
  id="onlineText"
>
  Online
</span>

</div>

</div>

<div class="top-actions">

<button
  class="status-btn online"
  id="statusBtn"
  onclick="toggleStatus()"
>
  Go Offline
</button>

<button
  class="logout-btn"
  onclick="logoutHost()"
>
  Logout
</button>

</div>

</div>

<!-- QUICK ACTIONS -->
<div class="quick-actions">

<button class="quick-btn">
  Live Dashboard
</button>

<button class="quick-btn">
  My Earnings
</button>

<button class="quick-btn">
  Call Analytics
</button>

</div>

<!-- STATS -->
<div class="stats">

<div class="stat-card">

<h1 id="liveStatus">
  Online
</h1>

<p>
  Current Status
</p>

</div>

<div class="stat-card">

<h1 id="earnings">
  ₹0
</h1>

<p>
  Total Earnings
</p>

</div>

<div class="stat-card">

<h1 id="totalCalls">
  0
</h1>

<p>
  Total Calls
</p>

</div>

<div class="stat-card">

<h1>
  4.9 ★
</h1>

<p>
  Rating
</p>

</div>

</div>

<!-- RECENT CALLS -->
<div class="panel">

<h2>
  Recent Calls
</h2>

<div id="hostCallsList"></div>

</div>

</main>

</div>

<!-- INCOMING CALL -->
<div
  class="incoming-popup"
  id="incomingPopup"
>

<div class="incoming-box">

<h2>
  Incoming Call
</h2>

<p id="callerName">
  User Calling...
</p>

<div class="incoming-btns">

<button
  class="btn btn-success"
  onclick="acceptCall()"
>
  Accept
</button>

<button
  class="btn btn-danger"
  onclick="rejectCall()"
>
  Reject
</button>

</div>

</div>

</div>

<script>

const params =

new URLSearchParams(
  window.location.search
);

const hostId =
params.get('id');

const hostName =
params.get('name');

const hostImage =
params.get('image');

const socket = io();

let currentStatus =
'Online';

/* PROFILE */
document.getElementById(
  'hostName'
).innerText = hostName;

document.getElementById(
  'hostImage'
).src = `/uploads/${hostImage}`;

/* REGISTER HOST */
socket.emit(
  'register-host',
  hostId
);

/* TOGGLE STATUS */
async function toggleStatus(){

  currentStatus =

  currentStatus === 'Online'
  ? 'Offline'
  : 'Online';

  const response = await fetch(

    '/toggle-host-status',

    {

      method:'POST',

      headers:{
        'Content-Type':
        'application/json'
      },

      body:JSON.stringify({

        hostId,

        status:currentStatus

      })

    }

  );

  const data =
  await response.json();

  if(data.success){

    document.getElementById(
      'liveStatus'
    ).innerText =
    currentStatus;

    const btn =

    document.getElementById(
      'statusBtn'
    );

    const text =

    document.getElementById(
      'onlineText'
    );

    if(currentStatus === 'Online'){

      btn.className =
      'status-btn online';

      btn.innerText =
      'Go Offline';

      text.innerText =
      'Online';

    }else{

      btn.className =
      'status-btn offline';

      btn.innerText =
      'Go Online';

      text.innerText =
      'Offline';

    }

  }

}

/* INCOMING CALL */
socket.on(
  'incoming-call',

  (data)=>{

    document.getElementById(
      'incomingPopup'
    ).classList.add(
      'open'
    );

    document.getElementById(
      'callerName'
    ).innerText =

    `${data.callerName} is calling...`;

  }

);

/* ACCEPT */
function acceptCall(){

  document.getElementById(
    'incomingPopup'
  ).classList.remove(
    'open'
  );

  window.location.href =
  '/call.html?role=host';

}

/* REJECT */
function rejectCall(){

  document.getElementById(
    'incomingPopup'
  ).classList.remove(
    'open'
  );

}

/* LOGOUT */
function logoutHost(){

  window.location.href =
  `/host-logout/${hostId}`;

}

/* LOAD CALLS */
async function loadRecentCalls(){

  const response = await fetch(

    `/host-call-history/${hostId}`

  );

  const calls =
  await response.json();

  document.getElementById(
    'totalCalls'
  ).innerText =
  calls.length;

  document.getElementById(
    'earnings'
  ).innerText =

  `₹${calls.length * 99}`;

  const list =

  document.getElementById(
    'hostCallsList'
  );

  list.innerHTML = '';

  if(!calls.length){

    list.innerHTML = `

      <p
      style="
      color:#cbd5e1;
      ">
        No calls yet
      </p>

    `;

    return;
  }

  calls.slice(0,10).forEach((call)=>{

    list.innerHTML += `

      <div class="row-item">

        <span>
          ${call.userMobile}
        </span>

        <span
        style="
        color:#cbd5e1;
        font-size:13px;
        ">

          ${
            new Date(
              call.callTime
            ).toLocaleDateString()
          }

        </span>

      </div>

    `;

  });

}

/* INITIAL LOAD */
loadRecentCalls();

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Login - FlirtyFly</title>

  <link rel="stylesheet" href="login.css">

</head>

<body>

<div class="container">

  <!-- LEFT -->
  <div class="left">

    <h1>Admin Access</h1>

    <p>
      Secure FlirtyFly Management Panel
    </p>

  </div>

  <!-- RIGHT -->
  <div class="right">

    <form
      class="login-box"
      id="adminLoginForm"
    >

      <h2>Admin Login</h2>

      <input
        type="text"
        id="adminUsername"
        placeholder="Username"
        required
      >

      <input
        type="password"
        id="adminPassword"
        placeholder="Password"
        required
      >

      <button type="submit">
        Login
      </button>

    </form>

  </div>

</div>

<script>

document.getElementById(
  "adminLoginForm"
).addEventListener("submit",

function(e){

  e.preventDefault();

  const username =

    document.getElementById(
      "adminUsername"
    ).value;

  const password =

    document.getElementById(
      "adminPassword"
    ).value;

  if(

    username === "Holagi14"

    &&

    password === "Holagi@14"

  ){

    localStorage.setItem(
      "adminLoggedIn",
      "true"
    );

    window.location.href =
      "/admin.html";

  }else{

    alert(
      "Invalid Admin Credentials"
    );

  }

});

</script>

</body>

</html>

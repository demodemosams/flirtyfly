<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Login - FlirtyFly</title>

  <link rel="stylesheet" href="login.css">

</head>

<body>

<div class="container">

  <!-- LEFT -->
  <div class="left">

    <h1>Admin Access</h1>

    <p>
      Secure FlirtyFly Management Panel
    </p>

  </div>

  <!-- RIGHT -->
  <div class="right">

    <form
      class="login-box"
      action="/admin-login"
      method="POST"
    >

      <h2>Admin Login</h2>

      <input
  type="number"
  name="mobile"
  placeholder="Admin Mobile"
  required
>

      <input
        type="password"
        name="password"
        placeholder="Password"
        required
      >

      <button type="submit">
        Login
      </button>

    </form>

  </div>

</div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>
  FlirtyFly Register
</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  font-family:Segoe UI,sans-serif;

  min-height:100vh;

  background:
  linear-gradient(
    135deg,
    #ffdde1,
    #ee9ca7
  );

  display:flex;

  justify-content:center;

  align-items:center;

  padding:20px;
}

/* CONTAINER */
.container{

  width:100%;

  max-width:1150px;

  background:white;

  border-radius:35px;

  overflow:hidden;

  display:grid;

  grid-template-columns:1fr 1fr;

  box-shadow:
  0 25px 60px rgba(0,0,0,0.15);
}

/* LEFT */
.left{

  background:
  linear-gradient(
    135deg,
    #ff416c,
    #ff4b2b
  );

  color:white;

  padding:70px 60px;

  display:flex;

  flex-direction:column;

  justify-content:center;

  position:relative;

  overflow:hidden;
}

.left::before{

  content:"";

  position:absolute;

  width:320px;
  height:320px;

  border-radius:50%;

  background:
  rgba(255,255,255,0.08);

  top:-120px;
  right:-80px;
}

.left::after{

  content:"";

  position:absolute;

  width:220px;
  height:220px;

  border-radius:50%;

  background:
  rgba(255,255,255,0.08);

  bottom:-80px;
  left:-80px;
}

.left-content{

  position:relative;

  z-index:2;
}

.left h1{

  font-size:62px;

  margin-bottom:25px;

  line-height:1.1;
}

.left p{

  font-size:18px;

  line-height:1.9;

  opacity:0.95;
}

.feature-list{

  margin-top:45px;
}

.feature{

  display:flex;

  align-items:center;

  gap:14px;

  margin-bottom:20px;

  font-size:16px;
}

.feature-icon{

  width:45px;
  height:45px;

  border-radius:14px;

  background:
  rgba(255,255,255,0.15);

  display:flex;

  justify-content:center;

  align-items:center;

  font-size:18px;
}

/* RIGHT */
.right{

  display:flex;

  justify-content:center;

  align-items:center;

  padding:50px;
}

/* FORM */
.register-box{

  width:100%;

  max-width:420px;
}

.register-box h2{

  font-size:40px;

  color:#ff416c;

  margin-bottom:12px;

  text-align:center;
}

.sub-text{

  text-align:center;

  color:#777;

  margin-bottom:35px;
}

/* INPUT */
.input-group{

  margin-bottom:20px;
}

.input-group label{

  display:block;

  margin-bottom:8px;

  color:#444;

  font-size:14px;

  font-weight:600;
}

.input-group input{

  width:100%;

  padding:17px;

  border:none;

  border-radius:16px;

  background:#f5f5f7;

  font-size:15px;

  outline:none;

  transition:0.3s;
}

.input-group input:focus{

  background:white;

  box-shadow:
  0 0 0 3px rgba(255,65,108,0.15);
}

/* OTP */
.otp-row{

  display:flex;

  gap:10px;

  margin-top:12px;
}

.send-otp-btn{

  border:none;

  padding:15px 18px;

  border-radius:14px;

  background:
  linear-gradient(
    135deg,
    #111827,
    #1f2937
  );

  color:white;

  cursor:pointer;

  font-weight:600;

  white-space:nowrap;
}

.verify-btn{

  width:100%;

  margin-top:12px;

  border:none;

  padding:15px;

  border-radius:16px;

  background:
  linear-gradient(
    135deg,
    #ff416c,
    #ff4b2b
  );

  color:white;

  font-size:15px;

  font-weight:700;

  cursor:pointer;
}

/* TERMS */
.terms{

  display:flex;

  align-items:flex-start;

  gap:10px;

  margin:18px 0;

  font-size:14px;

  color:#555;
}

.terms a{

  color:#ff416c;

  text-decoration:none;

  font-weight:600;
}

/* REGISTER BUTTON */
.register-btn{

  width:100%;

  border:none;

  padding:18px;

  border-radius:18px;

  background:
  linear-gradient(
    135deg,
    #ff416c,
    #ff4b2b
  );

  color:white;

  font-size:17px;

  font-weight:700;

  cursor:pointer;

  transition:0.3s;

  box-shadow:
  0 15px 35px rgba(255,65,108,0.25);
}

.register-btn:hover{

  transform:translateY(-3px);
}

/* LOGIN */
.login-text{

  margin-top:24px;

  text-align:center;

  color:#666;
}

.login-text a{

  color:#ff416c;

  text-decoration:none;

  font-weight:700;
}

/* MOBILE */
@media(max-width:950px){

  .container{

    grid-template-columns:1fr;
  }

  .left{

    padding:60px 35px;
  }

  .left h1{

    font-size:48px;
  }

  .right{

    padding:40px 25px 50px;
  }

}

</style>

</head>

<body>

<div class="container">

<!-- LEFT -->
<div class="left">

<div class="left-content">

<h1>
  Join FlirtyFly
</h1>

<p>
  Create your premium account and start exploring verified live connections instantly.
</p>

<div class="feature-list">

<div class="feature">

<div class="feature-icon">
  ✓
</div>

<span>
  Safe & Secure Platform
</span>

</div>

<div class="feature">

<div class="feature-icon">
  ❤
</div>

<span>
  Verified Hosts
</span>

</div>

<div class="feature">

<div class="feature-icon">
  ⚡
</div>

<span>
  Instant Access
</span>

</div>

</div>

</div>

</div>

<!-- RIGHT -->
<div class="right">

<form class="register-box">

<h2>
  Create Account
</h2>

<p class="sub-text">
  Register with OTP Verification
</p>

<!-- NAME -->
<div class="input-group">

<label>
  Full Name
</label>

<input
  type="text"
  id="name"
  placeholder="Enter your name"
  required
>

</div>

<!-- EMAIL -->
<div class="input-group">

<label>
  Email Address
</label>

<input
  type="email"
  id="email"
  placeholder="Enter email"
  required
>

</div>

<!-- MOBILE -->
<div class="input-group">

<label>
  Mobile Number
</label>

<input
  type="tel"
  id="mobile"
  placeholder="Enter mobile number"
  required
>

</div>

<!-- OTP -->
<div class="input-group">

<label>
  Email OTP Verification
</label>

<div class="otp-row">

<input
  type="text"
  id="otp"
  placeholder="Enter OTP"
>

<button
  type="button"
  class="send-otp-btn"
  onclick="sendOTP()"
>

  Send OTP

</button>

</div>

<button
  type="button"
  class="verify-btn"
  onclick="verifyOTP()"
>

  Verify OTP

</button>

</div>

<!-- PASSWORD -->
<div class="input-group">

<label>
  Password
</label>

<input
  type="password"
  id="password"
  placeholder="Create password"
  required
>

</div>

<!-- CONFIRM -->
<div class="input-group">

<label>
  Confirm Password
</label>

<input
  type="password"
  id="confirmPassword"
  placeholder="Confirm password"
  required
>

</div>

<!-- TERMS -->
<div class="terms">

<input
  type="checkbox"
  id="termsCheck"
  required
>

<label for="termsCheck">

  I agree to the

  <a href="/terms.html">

    Terms & Conditions

  </a>

</label>

</div>

<!-- REGISTER -->
<button
  type="submit"
  class="register-btn"
>

  Create Account

</button>

<p class="login-text">

  Already have an account?

  <a href="/login.html">

    Login

  </a>

</p>

</form>

</div>

</div>

<script>

let generatedOTP = "";
let otpVerified = false;

/* SEND OTP */
async function sendOTP(){

  const email =

  document.getElementById(
    "email"
  ).value;

  if(!email){

    alert(
      "Enter Email First"
    );

    return;
  }

  const response = await fetch(

    "/send-otp",

    {

      method:"POST",

      headers:{
        "Content-Type":
        "application/json"
      },

      body:JSON.stringify({

        email

      })

    }

  );

  const data =
  await response.json();

  if(data.success){

    generatedOTP =
    data.otp;

    alert(
      "OTP Sent Successfully"
    );

  }else{

    alert(
      "OTP Send Failed"
    );

  }

}

/* VERIFY OTP */
async function verifyOTP(){

  const otp =

  document.getElementById(
    "otp"
  ).value;

  const response = await fetch(

    "/verify-otp",

    {

      method:"POST",

      headers:{
        "Content-Type":
        "application/json"
      },

      body:JSON.stringify({

        otp

      })

    }

  );

  const data =
  await response.json();

  if(data.success){

    otpVerified = true;

    alert(
      "OTP Verified Successfully"
    );

  }else{

    alert(
      "Invalid OTP"
    );

  }

}

/* REGISTER */
document.querySelector(
  ".register-box"
).addEventListener(

  "submit",

  async function(e){

    e.preventDefault();

    if(!otpVerified){

      alert(
        "Please Verify OTP"
      );

      return;
    }

    const name =

    document.getElementById(
      "name"
    ).value;

    const email =

    document.getElementById(
      "email"
    ).value;

    const mobile =

    document.getElementById(
      "mobile"
    ).value;

    const password =

    document.getElementById(
      "password"
    ).value;

    const confirmPassword =

    document.getElementById(
      "confirmPassword"
    ).value;

    if(password !== confirmPassword){

      alert(
        "Passwords do not match"
      );

      return;
    }

    const response = await fetch(

      "/register",

      {

        method:"POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({

          name,
          email,
          mobile,
          password

        })

      }

    );

    const data =
    await response.text();

    alert(data);

    if(
      data ===
      "Registration Successful"
    ){

      window.location.href =
      "/login.html";

    }

  }

);

</script>

</body>

</html>

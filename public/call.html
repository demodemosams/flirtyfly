<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Video Call - FlirtyFly</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  font-family:Segoe UI,sans-serif;

  height:100vh;

  overflow:hidden;

  background:#0f172a;

  color:white;
}

/* MAIN VIDEO AREA */
.video-wrapper{

  position:relative;

  width:100%;

  height:100vh;

  overflow:hidden;
}

/* REMOTE VIDEO */
#remoteVideo{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  background:black;
}

/* LOCAL VIDEO */
#localVideo{

  position:absolute;

  width:260px;
  height:180px;

  bottom:120px;
  right:30px;

  object-fit:cover;

  border-radius:24px;

  border:3px solid rgba(255,255,255,0.25);

  background:black;

  box-shadow:
  0 15px 40px rgba(0,0,0,0.35);

  z-index:10;
}

/* TOP BAR */
.top-bar{

  position:absolute;

  top:25px;
  left:50%;

  transform:translateX(-50%);

  width:92%;

  padding:18px 24px;

  border-radius:22px;

  background:
  rgba(255,255,255,0.08);

  backdrop-filter:blur(18px);

  border:1px solid rgba(255,255,255,0.08);

  display:flex;

  justify-content:space-between;

  align-items:center;

  z-index:20;
}

.call-info h2{

  font-size:22px;

  margin-bottom:4px;
}

.call-info p{

  font-size:14px;

  opacity:0.8;
}

/* TIMER */
.call-timer{

  padding:12px 22px;

  border-radius:50px;

  background:
  rgba(255,255,255,0.08);

  font-size:16px;

  font-weight:600;

  border:1px solid rgba(255,255,255,0.08);
}

/* CONTROLS */
.controls{

  position:absolute;

  left:50%;
  bottom:35px;

  transform:translateX(-50%);

  display:flex;

  gap:22px;

  z-index:25;
}

/* BUTTONS */
.control-btn{

  width:72px;
  height:72px;

  border:none;

  border-radius:50%;

  display:flex;

  justify-content:center;
  align-items:center;

  cursor:pointer;

  font-size:18px;

  color:white;

  transition:0.3s;

  backdrop-filter:blur(10px);
}

.control-btn:hover{

  transform:translateY(-4px);
}

/* MUTE */
.mute-btn{

  background:
  rgba(255,255,255,0.12);

  border:1px solid rgba(255,255,255,0.08);
}

/* END CALL */
.end-call-btn{

  background:
  linear-gradient(
    135deg,
    #ff416c,
    #ff4b2b
  );

  box-shadow:
  0 15px 30px rgba(255,65,108,0.35);
}

/* MOBILE */
@media(max-width:768px){

  #localVideo{

    width:140px;
    height:190px;

    right:15px;
    bottom:120px;

    border-radius:18px;
  }

  .top-bar{

    flex-direction:column;

    gap:15px;

    align-items:flex-start;
  }

  .controls{

    gap:15px;
  }

  .control-btn{

    width:62px;
    height:62px;
  }

  .call-info h2{

    font-size:19px;
  }
}

</style>

</head>

<body>

<div class="video-wrapper">

  <!-- REMOTE -->
  <video
    id="remoteVideo"
    autoplay
    playsinline
  ></video>

  <!-- LOCAL -->
  <video
    id="localVideo"
    autoplay
    muted
    playsinline
  ></video>

  <!-- TOP BAR -->
  <div class="top-bar">

    <div class="call-info">

      <h2>
        FlirtyFly Live Call
      </h2>

      <p>
        Secure premium connection
      </p>

    </div>

    <div
      class="call-timer"
      id="callTimer"
    >
      01:00
    </div>

  </div>

  <!-- CONTROLS -->
  <div class="controls">

    <button
      class="control-btn mute-btn"
      onclick="toggleMute()"
      id="muteBtn"
    >
      🔇
    </button>

    <button
      class="control-btn end-call-btn"
      onclick="endCall()"
    >
      📞
    </button>

  </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

/* YOUR ORIGINAL JS */
const params =

  new URLSearchParams(
    window.location.search
  );

const roomId = "flirty-room";

const socket = io();

socket.emit(
  "join-room",
  roomId
);

const localVideo =
  document.getElementById(
    "localVideo"
  );

const remoteVideo =
  document.getElementById(
    "remoteVideo"
  );

let localStream;

let peerConnection;

let timerInterval;

const configuration = {

  iceServers:[

    {
      urls:
      "stun:stun.l.google.com:19302"
    }

  ]

};

let isMuted = false;

function toggleMute(){

  const audioTrack =

    localStream
    .getAudioTracks()[0];

  if(isMuted){

    audioTrack.enabled = true;

    document.getElementById(
      "muteBtn"
    ).innerText = "🔇";

    isMuted = false;

  }else{

    audioTrack.enabled = false;

    document.getElementById(
      "muteBtn"
    ).innerText = "🎤";

    isMuted = true;

  }

}

function endCall(){

  if(localStream){

    localStream
      .getTracks()
      .forEach((track) => {

        track.stop();

      });

  }

  if(peerConnection){

    peerConnection.close();

  }

  clearInterval(timerInterval);

  if(

    window.location.search
    .includes("role=host")

  ){

    window.location.href =
    `/host.html?id=${localStorage.getItem("hostId")}&name=${localStorage.getItem("hostName")}&image=${localStorage.getItem("hostImage")}`;

  }else{

    window.location.href =
      "/user.html";

  }

}

async function startVideo(){

  try{

    const stream =

      await navigator.mediaDevices
      .getUserMedia({

        video:true,
        audio:true

      });

    localStream = stream;

    localVideo.srcObject =
      stream;

    createPeerConnection();

    if(

      window.location.search
      .includes("role=user")

    ){

      createOffer();

    }

  }catch(error){

    console.log(error);

    alert(
      "Camera access denied"
    );

  }

}

function createPeerConnection(){

  peerConnection =

    new RTCPeerConnection(
      configuration
    );

  localStream
    .getTracks()
    .forEach((track) => {

      peerConnection.addTrack(
        track,
        localStream
      );

    });

  peerConnection.ontrack =

    (event) => {

      remoteVideo.srcObject =

        event.streams[0];

    };

  peerConnection.onicecandidate =

    (event) => {

      if(event.candidate){

        socket.emit(

          "ice-candidate",

          {

            roomId,

            candidate:
              event.candidate

          }

        );

      }

    };

}

async function createOffer(){

  const offer =

    await peerConnection
      .createOffer();

  await peerConnection
    .setLocalDescription(
      offer
    );

  socket.emit(

    "offer",

    {

      roomId,
      offer

    }

  );

}

socket.on(

  "offer",

  async (offer) => {

    if(!peerConnection){

      createPeerConnection();

    }

    await peerConnection
      .setRemoteDescription(

        new RTCSessionDescription(
          offer
        )

      );

    const answer =

      await peerConnection
        .createAnswer();

    await peerConnection
      .setLocalDescription(
        answer
      );

    socket.emit(

      "answer",

      {

        roomId,
        answer

      }

    );

  }

);

socket.on(

  "answer",

  async (answer) => {

    await peerConnection
      .setRemoteDescription(

        new RTCSessionDescription(
          answer
        )

      );

  }

);

socket.on(

  "ice-candidate",

  async (candidate) => {

    try{

      await peerConnection
        .addIceCandidate(

          new RTCIceCandidate(
            candidate
          )

        );

    }catch(error){

      console.log(error);

    }

  }

);

async function startTimer(){

  if(

    !window.location.search
    .includes("role=user")

  ){

    document.getElementById(
      "callTimer"
    ).style.display = "none";

    return;

  }

  let freeSeconds =

  localStorage.getItem(
    "freeSeconds"
  ) || 60;

  timerInterval =

  setInterval(() => {

    freeSeconds--;

    localStorage.setItem(
      "freeSeconds",
      freeSeconds
    );

    const minutes =

      String(
        Math.floor(
          freeSeconds / 60
        )
      ).padStart(2,"0");

    const seconds =

      String(
        freeSeconds % 60
      ).padStart(2,"0");

    document.getElementById(
      "callTimer"
    ).innerText =

    `${minutes}:${seconds}`;

    if(freeSeconds <= 0){

      clearInterval(
        timerInterval
      );

      alert(
        "Free Call Ended. Please Subscribe."
      );

      localStorage.removeItem(
        "freeSeconds"
      );

      endCall();

    }

  },1000);

}

startVideo();

if(

  window.location.search
  .includes("role=user")

){

  setTimeout(() => {

    startTimer();

  },2000);

}else{

  document.getElementById(
    "callTimer"
  ).style.display = "none";

}

</script>

</body>

</html>

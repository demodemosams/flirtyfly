<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💋</text></svg>">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  Video Call - FlirtyFly 💋
</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  font-family:Segoe UI,sans-serif;

  height:100vh;

  overflow:hidden;

  background:#0f172a;

  color:white;
}

/* MAIN */
.video-wrapper{

  position:relative;

  width:100%;

  height:100vh;

  overflow:hidden;
}

/* REMOTE VIDEO */
#remoteVideo{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  background:black;
}

/* LOCAL VIDEO */
#localVideo{

  position:absolute;

  width:260px;
  height:180px;

  bottom:120px;
  right:30px;

  object-fit:cover;

  border-radius:24px;

  border:3px solid rgba(255,255,255,0.2);

  background:black;

  box-shadow:
  0 15px 40px rgba(0,0,0,0.35);

  z-index:10;
}

/* TOP BAR */
.top-bar{

  position:absolute;

  top:25px;
  left:50%;

  transform:translateX(-50%);

  width:92%;

  padding:18px 24px;

  border-radius:22px;

  background:
  rgba(255,255,255,0.08);

  backdrop-filter:blur(18px);

  border:
  1px solid rgba(255,255,255,0.08);

  display:flex;

  justify-content:space-between;

  align-items:center;

  z-index:20;
}

.call-info h2{

  font-size:22px;

  margin-bottom:4px;
}

.call-info p{

  font-size:14px;

  opacity:0.8;
}

/* TIMER */
.call-timer{

  padding:12px 22px;

  border-radius:50px;

  background:
  rgba(255,255,255,0.08);

  font-size:16px;

  font-weight:600;

  border:
  1px solid rgba(255,255,255,0.08);
}

/* CONTROLS */
.controls{

  position:absolute;

  left:50%;
  bottom:35px;

  transform:translateX(-50%);

  display:flex;

  gap:22px;

  z-index:25;
}

/* BUTTON */
.control-btn{

  width:72px;
  height:72px;

  border:none;

  border-radius:50%;

  display:flex;

  justify-content:center;
  align-items:center;

  cursor:pointer;

  font-size:18px;

  color:white;

  transition:0.3s;

  backdrop-filter:blur(10px);
}

.control-btn:hover{

  transform:translateY(-4px);
}

/* MUTE */
.mute-btn{

  background:
  rgba(255,255,255,0.12);

  border:
  1px solid rgba(255,255,255,0.08);
}

/* END CALL */
.end-call-btn{

  background:
  linear-gradient(
    135deg,
    #ff416c,
    #ff4b2b
  );

  box-shadow:
  0 15px 30px rgba(255,65,108,0.35);
}

/* MOBILE */
@media(max-width:768px){

  #localVideo{

    width:140px;
    height:190px;

    right:15px;
    bottom:120px;

    border-radius:18px;
  }

  .top-bar{

    flex-direction:column;

    gap:15px;

    align-items:flex-start;
  }

  .controls{

    gap:15px;
  }

  .control-btn{

    width:62px;
    height:62px;
  }

}

/* PAYWALL */

.paywall{

  position:fixed;

  inset:0;

  background:rgba(8,10,22,0.92);

  backdrop-filter:blur(10px);

  display:none;

  justify-content:center;

  align-items:center;

  padding:20px;

  z-index:1000;
}

.paywall.open{

  display:flex;
}

.paywall-box{

  width:100%;

  max-width:400px;

  background:#141a2e;

  border:
  1px solid rgba(255,255,255,0.1);

  border-radius:24px;

  padding:34px 26px;

  text-align:center;

  color:white;

  font-family:'Poppins',sans-serif;
}

.paywall-icon{

  font-size:46px;

  margin-bottom:12px;
}

.paywall-box h2{

  font-size:24px;

  margin-bottom:8px;
}

.paywall-box p{

  color:#94a3b8;

  font-size:14px;

  line-height:1.6;

  margin-bottom:26px;
}

.paywall-btn{

  display:block;

  width:100%;

  border:none;

  padding:15px;

  border-radius:14px;

  color:white;

  font-family:inherit;

  font-size:15px;

  font-weight:600;

  cursor:pointer;

  text-decoration:none;

  background:
  linear-gradient(
    135deg,
    #ff4f87,
    #ff7b54
  );
}

.paywall-skip{

  display:inline-block;

  margin-top:16px;

  color:#94a3b8;

  font-size:13px;

  text-decoration:none;
}

</style>

</head>

<body>

<div class="video-wrapper">

  <!-- REMOTE -->
  <video
    id="remoteVideo"
    autoplay
    playsinline
  ></video>

  <!-- LOCAL -->
  <video
    id="localVideo"
    autoplay
    muted
    playsinline
  ></video>

  <!-- TOP BAR -->
  <div class="top-bar">

    <div class="call-info">

      <h2>
        FlirtyFly 💋 Live Call
      </h2>

      <p>
        Secure premium connection
      </p>

    </div>

    <div
      class="call-timer"
      id="callTimer"
    >
      00:00
    </div>

  </div>

  <!-- CONTROLS -->
  <div class="controls">

    <button
      class="control-btn mute-btn"
      onclick="toggleMute()"
      id="muteBtn"
    >
      🔇
    </button>

    <button
      class="control-btn end-call-btn"
      onclick="endCall()"
    >
      📞
    </button>

  </div>

</div>

<!-- PAYWALL -->
<div
  class="paywall"
  id="paywall"
>

  <div class="paywall-box">

    <div class="paywall-icon">
      💎
    </div>

    <h2>
      Your credits are over
    </h2>

    <p>
      Your free minute has ended. Go Premium to keep talking with your favourite hosts.
    </p>

    <a
      class="paywall-btn"
      href="/user.html#subscriptions"
    >
      Go Premium
    </a>

    <a
      class="paywall-skip"
      href="/user.html"
    >
      Not now
    </a>

  </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

/* PARAMS */

const params =

new URLSearchParams(
  window.location.search
);

const isHost =

window.location.search
.includes("role=host");

/* EACH CALL GETS ITS OWN ROOM SO TWO CALLS NEVER MIX */

const roomId =

localStorage.getItem(
  "currentCallId"
)

|| "flirty-room";

const socket = io();

socket.emit(
  "join-room",
  roomId
);

/* CALL TIMING FOR HOST EARNINGS */

socket.emit(

  "call-joined",

  {

    callId:
    localStorage.getItem(
      "currentCallId"
    ),

    role:

    window.location.search
    .includes("role=host")

    ? "host"
    : "user"

  }

);

/* OTHER SIDE LEFT */

socket.on(

  "call-ended",

  ()=>{

    endCall();

  }

);

/* BOTH SIDES CONNECTED: SERVER SAYS HOW LONG THE USER MAY TALK */

socket.on(

  "call-started",

  (data)=>{

    startTimer(data.seconds);

  }

);

/* OUT OF TIME: STOP THE CALL AND SHOW THE PAYWALL */

socket.on(

  "credits-over",

  ()=>{

    stopCall();

    document.getElementById(
      "paywall"
    ).classList.add("open");

  }

);

/* VIDEOS */

const localVideo =

document.getElementById(
  "localVideo"
);

const remoteVideo =

document.getElementById(
  "remoteVideo"
);

let localStream;

let peerConnection;

let timerInterval;

let isMuted = false;

let callStopped = false;

/* RTC */

const configuration = {

  iceServers:[

    {

      urls:
      "stun:stun.l.google.com:19302"

    }

  ]

};

/* MUTE */

function toggleMute(){

  const audioTrack =

  localStream
  .getAudioTracks()[0];

  if(isMuted){

    audioTrack.enabled = true;

    document.getElementById(
      "muteBtn"
    ).innerText = "🔇";

    isMuted = false;

  }else{

    audioTrack.enabled = false;

    document.getElementById(
      "muteBtn"
    ).innerText = "🎤";

    isMuted = true;

  }

}

/* STOP CAMERA, MIC AND CONNECTION */

function stopCall(){

  callStopped = true;

  if(localStream){

    localStream
    .getTracks()
    .forEach((track)=>{

      track.stop();

    });

  }

  if(peerConnection){

    peerConnection.close();

  }

  clearInterval(
    timerInterval
  );

}

/* END CALL */

function endCall(){

  stopCall();

  /* HOST */

  if(isHost){

    window.location.href =

    `/host.html?id=${localStorage.getItem("hostId")}&name=${localStorage.getItem("hostName")}&image=${localStorage.getItem("hostImage")}`;

  }else{

    window.location.href =
    "/user.html";

  }

}

/* START VIDEO */

async function startVideo(){

  try{

    const stream =

    await navigator.mediaDevices
    .getUserMedia({

      video:true,
      audio:true

    });

    localStream = stream;

    /* PAYWALL APPEARED WHILE THE CAMERA PROMPT WAS OPEN */

    if(callStopped){

      stopCall();

      return;

    }

    localVideo.srcObject =
    stream;

    createPeerConnection();

    if(

      window.location.search
      .includes("role=user")

    ){

      createOffer();

    }

  }catch(error){

    console.log(error);

    alert(
      "Camera access denied"
    );

  }

}

/* CREATE PEER */

function createPeerConnection(){

  peerConnection =

  new RTCPeerConnection(
    configuration
  );

  localStream
  .getTracks()
  .forEach((track)=>{

    peerConnection.addTrack(

      track,
      localStream

    );

  });

  peerConnection.ontrack =

  (event)=>{

    remoteVideo.srcObject =

    event.streams[0];

  };

  peerConnection.onicecandidate =

  (event)=>{

    if(event.candidate){

      socket.emit(

        "ice-candidate",

        {

          roomId,

          candidate:
          event.candidate

        }

      );

    }

  };

}

/* OFFER */

async function createOffer(){

  const offer =

  await peerConnection
  .createOffer();

  await peerConnection
  .setLocalDescription(
    offer
  );

  socket.emit(

    "offer",

    {

      roomId,
      offer

    }

  );

}

/* RECEIVE OFFER */

socket.on(

  "offer",

  async (offer)=>{

    if(!peerConnection){

      createPeerConnection();

    }

    await peerConnection
    .setRemoteDescription(

      new RTCSessionDescription(
        offer
      )

    );

    const answer =

    await peerConnection
    .createAnswer();

    await peerConnection
    .setLocalDescription(
      answer
    );

    socket.emit(

      "answer",

      {

        roomId,
        answer

      }

    );

  }

);

/* RECEIVE ANSWER */

socket.on(

  "answer",

  async (answer)=>{

    await peerConnection
    .setRemoteDescription(

      new RTCSessionDescription(
        answer
      )

    );

  }

);

/* ICE */

socket.on(

  "ice-candidate",

  async (candidate)=>{

    try{

      await peerConnection
      .addIceCandidate(

        new RTCIceCandidate(
          candidate
        )

      );

    }catch(error){

      console.log(error);

    }

  }

);

/* TIMER */

/* THE SERVER ENDS THE CALL WHEN TIME IS UP; THIS ONLY SHOWS THE COUNTDOWN */

function startTimer(seconds){

  clearInterval(
    timerInterval
  );

  /* UNLIMITED */

  if(seconds === null){

    document.getElementById(
      "callTimer"
    ).innerText =
    "Unlimited";

    return;

  }

  let remainingSeconds = seconds;

  updateTimer(
    remainingSeconds
  );

  timerInterval =

  setInterval(()=>{

    remainingSeconds =

    Math.max(
      remainingSeconds - 1,
      0
    );

    updateTimer(
      remainingSeconds
    );

    if(remainingSeconds <= 0){

      clearInterval(
        timerInterval
      );

    }

  },1000);

}

/* UPDATE TIMER */

function updateTimer(seconds){

  const minutes =

  String(

    Math.floor(
      seconds / 60
    )

  ).padStart(2,"0");

  const remaining =

  String(
    seconds % 60
  ).padStart(2,"0");

  document.getElementById(
    "callTimer"
  ).innerText =

  `${minutes}:${remaining}`;

}

/* START */

/* THE HOST DOES NOT SEE THE USER'S COUNTDOWN */

if(isHost){

  document.getElementById(
    "callTimer"
  ).style.display = "none";

}

startVideo();

</script>

</body>

</html>
